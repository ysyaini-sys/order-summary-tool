<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在线表格</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,"Microsoft YaHei",sans-serif; background:#f5f7fa; color:#333; padding:16px; }
.toolbar { display:flex; gap:8px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
.toolbar h1 { font-size:17px; color:#2f5597; margin-right:auto; }
.btn { background:#4472C4; color:#fff; border:none; padding:7px 16px; border-radius:6px; cursor:pointer; font-size:13px; font-weight:500; }
.btn:hover { background:#36569e; }
.btn-green { background:#00b96b; }
.btn-green:hover { background:#009a59; }
.btn-orange { background:#e67e22; }
.btn-orange:hover { background:#d35400; }
.table-wrap { background:#fff; border-radius:8px; box-shadow:0 1px 3px rgba(0,0,0,.08); overflow:auto; max-height:calc(100vh - 70px); }
table { border-collapse:collapse; font-size:13px; }
th { background:#4472C4; color:#fff; padding:8px 10px; text-align:center; font-weight:600; position:sticky; top:0; z-index:10; border:1px solid #3a5a8c; white-space:nowrap; }
td { padding:6px 10px; border:1px solid #e0e6ed; text-align:center; vertical-align:middle; }
td.col-id { font-family:Consolas,Monaco,monospace; text-align:center; white-space:nowrap; }
td.col-num { text-align:right; font-family:Consolas,Monaco,monospace; white-space:nowrap; }
td.col-text { text-align:left; }
td[contenteditable="true"]:focus { outline:2px solid #4472C4; background:#e8f0fe; }
td[contenteditable="true"]:hover { background:#f8fafc; }
tr:nth-child(even) td { background:#fafbfc; }
tr:nth-child(even) td[contenteditable="true"]:focus { background:#e8f0fe; }
.hint { font-size:11px; color:#999; margin-top:8px; }
.empty { text-align:center; color:#999; padding:40px; font-size:14px; }
</style>
</head>
<body>
<div class="toolbar">
  <h1 id="title">汇总数据</h1>
  <button class="btn btn-green" onclick="copyAll()">📋 复制全部</button>
  <button class="btn" onclick="downloadCSV()">⬇ 下载CSV</button>
  <button class="btn btn-orange" onclick="addRow()">➕ 加一行</button>
</div>
<div class="table-wrap">
  <table id="tbl"></table>
</div>
<p class="hint">点击单元格直接编辑 · 点击表头排序 · Tab键切换下一格</p>
<script>
var data = [];
var tableType = '';
var sortCol = -1;
var sortAsc = true;
var SPECIAL_ID = '3823309765342266082';

var COL_WIDTHS = {
  summary: [80, 180, 360, 100, 120, 120],
  orders:  [180, 360, 90, 90, 90, 110, 110]
};

function init() {
  try {
    data = JSON.parse(localStorage.getItem('sheetRows') || '[]');
    var t = localStorage.getItem('sheetTitle') || '在线表格';
    document.getElementById('title').textContent = t;
    document.title = t;
  } catch(e) {}

  if (!data.length) {
    document.getElementById('tbl').innerHTML = '<tr><td class="empty">没有数据，请回到主页面先汇总</td></tr>';
    return;
  }

  var header = data[0].join('|');
  if (header.indexOf('包装') !== -1 && header.indexOf('商品ID') !== -1) {
    tableType = 'summary';
  } else {
    tableType = 'orders';
  }

  render();
}

function getColClass(c, header) {
  if (tableType === 'summary') {
    if (c === 0) return 'col-text';
    if (c === 1) return 'col-id';
    if (c === 2) return 'col-text';
    return 'col-num';
  } else {
    if (c === 0) return 'col-id';
    if (c === 1) return 'col-text';
    return 'col-num';
  }
}

function calcRowspan(r, c) {
  if (data[r][c] === '' || data[r][c] === null || data[r][c] === undefined) return 0;
  var span = 1;
  for (var i = r + 1; i < data.length; i++) {
    var v = data[i][c];
    if (v === '' || v === null || v === undefined) span++;
    else break;
  }
  return span;
}

function shouldMerge(col, r) {
  if (tableType === 'summary') {
    return [0, 1, 2, 5].indexOf(col) !== -1;
  } else {
    if (col === 4) {
      var idVal = data[r][0];
      for (var rr = r; rr >= 1; rr--) {
        if (data[rr][0] !== '' && data[rr][0] !== null) { idVal = data[rr][0]; break; }
      }
      if (String(idVal) === SPECIAL_ID) return false;
    }
    return [0, 4, 6].indexOf(col) !== -1;
  }
}

function formatCell(v, colClass) {
  if (v === '' || v === null || v === undefined) return ' ';
  if (colClass === 'col-num' && typeof v === 'number') {
    return v.toLocaleString('zh-CN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
  }
  return String(v);
}

function render() {
  var cols = data[0].length;
  var widths = COL_WIDTHS[tableType] || [];

  var html = '<thead><tr>';
  for (var c = 0; c < cols; c++) {
    var arrow = '';
    if (sortCol === c) arrow = sortAsc ? ' ▲' : ' ▼';
    html += '<th onclick="sortBy(' + c + ')">' + (data[0][c] === '' ? ' ' : data[0][c]) + '<span style="font-size:10px;opacity:.7">' + arrow + '</span></th>';
  }
  html += '<th style="width:36px;position:sticky;right:0;background:#4472C4;"></th>';
  html += '</tr></thead><tbody>';

  for (var r = 1; r < data.length; r++) {
    html += '<tr>';
    for (var c = 0; c < cols; c++) {
      var colClass = getColClass(c, data[0]);
      var v = data[r][c];
      var display = formatCell(v, colClass);

      var rowspan = '';
      if (shouldMerge(c, r)) {
        var rs = calcRowspan(r, c);
        if (rs > 1) rowspan = ' rowspan="' + rs + '"';
        else if (rs === 0) {
          continue;
        }
      }

      html += '<td class="' + colClass + '" contenteditable="true" data-row="' + r + '" data-col="' + c + '"' + rowspan + '>' + display + '</td>';
    }
    html += '<td style="text-align:center;cursor:pointer;color:#e74c3c;" onclick="delRow(' + r + ')">✕</td>';
    html += '</tr>';
  }
  html += '</tbody>';
  document.getElementById('tbl').innerHTML = html;

  var ths = document.querySelectorAll('thead th');
  for (var i = 0; i < cols && i < widths.length; i++) {
    ths[i].style.minWidth = widths[i] + 'px';
  }

  document.querySelectorAll('td[contenteditable]').forEach(function(td) {
    td.addEventListener('blur', function() {
      var r = parseInt(this.dataset.row);
      var c = parseInt(this.dataset.col);
      var raw = this.textContent.trim();
      var colClass = this.className;
      if (colClass.indexOf('col-num') !== -1) {
        var n = parseFloat(raw.replace(/,/g, ''));
        data[r][c] = isNaN(n) ? raw : n;
      } else {
        data[r][c] = raw;
      }
    });
    td.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') { e.preventDefault(); this.blur(); }
      if (e.key === 'Tab') { e.preventDefault(); moveFocus(this, e.shiftKey); }
    });
  });
}

function moveFocus(td, back) {
  var r = parseInt(td.dataset.row);
  var c = parseInt(td.dataset.col);
  var target = back
    ? document.querySelector('td[data-row="' + r + '"][data-col="' + (c - 1) + '"]')
    : document.querySelector('td[data-row="' + r + '"][data-col="' + (c + 1) + '"]');
  if (!target && !back) {
    var nextRow = document.querySelector('td[data-row="' + (r + 1) + '"][data-col="0"]');
    if (nextRow) nextRow.focus();
  } else if (!target && back) {
    var prevRow = document.querySelector('td[data-row="' + (r - 1) + '"][data-col="' + (data[0].length - 1) + '"]');
    if (prevRow) prevRow.focus();
  } else if (target) {
    target.focus();
    var range = document.createRange();
    range.selectNodeContents(target);
    range.collapse(false);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }
}

function sortBy(col) {
  if (sortCol === col) sortAsc = !sortAsc;
  else { sortCol = col; sortAsc = true; }
  var bodyRows = data.slice(1);
  bodyRows.sort(function(a, b) {
    var va = a[col], vb = b[col];
    if (typeof va === 'number' && typeof vb === 'number') return sortAsc ? va - vb : vb - va;
    return sortAsc ? String(va).localeCompare(String(vb)) : String(vb).localeCompare(String(va));
  });
  data = [data[0]].concat(bodyRows);
  render();
}

function addRow() {
  var cols = data[0].length;
  var newRow = [];
  for (var i = 0; i < cols; i++) newRow.push('');
  data.push(newRow);
  render();
  var lastRow = data.length - 1;
  var cell = document.querySelector('td[data-row="' + lastRow + '"][data-col="0"]');
  if (cell) cell.focus();
}

function delRow(r) {
  if (!confirm('删除第 ' + r + ' 行？')) return;
  data.splice(r, 1);
  render();
}

function getTextData() {
  var active = document.activeElement;
  if (active && active.dataset && active.dataset.row) {
    var r = parseInt(active.dataset.row);
    var c = parseInt(active.dataset.col);
    var raw = active.textContent.trim();
    if (active.className.indexOf('col-num') !== -1) {
      var n = parseFloat(raw.replace(/,/g, ''));
      data[r][c] = isNaN(n) ? raw : n;
    } else {
      data[r][c] = raw;
    }
  }
  return data;
}

function copyAll() {
  getTextData();
  var text = data.map(function(r) { return r.join('\t'); }).join('\n');
  navigator.clipboard.writeText(text).then(function() {
    alert('已复制到剪贴板，可直接粘贴到Excel');
  }).catch(function() {
    var ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    alert('已复制到剪贴板');
  });
}

function downloadCSV() {
  getTextData();
  var csv = '\ufeff' + data.map(function(r) {
    return r.map(function(v) {
      if (typeof v === 'number') return v.toFixed(2);
      return '"' + String(v).replace(/"/g, '""') + '"';
    }).join(',');
  }).join('\n');
  var blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (document.title || '汇总') + '.csv';
  a.click();
}

init();
</script>
</body>
</html>
