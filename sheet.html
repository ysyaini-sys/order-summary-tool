<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在线表格</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,"Microsoft YaHei",sans-serif; background:#f5f7fa; color:#333; padding:20px; }
.toolbar { display:flex; gap:10px; align-items:center; margin-bottom:16px; flex-wrap:wrap; }
.toolbar h1 { font-size:18px; color:#2f5597; margin-right:auto; }
.btn { background:#4472C4; color:#fff; border:none; padding:8px 18px; border-radius:6px; cursor:pointer; font-size:13px; font-weight:500; }
.btn:hover { background:#36569e; }
.btn-green { background:#00b96b; }
.btn-green:hover { background:#009a59; }
.table-wrap { background:#fff; border-radius:8px; box-shadow:0 1px 3px rgba(0,0,0,.08); overflow:auto; max-height:calc(100vh - 80px); }
table { width:100%; border-collapse:collapse; font-size:13px; }
th { background:#4472C4; color:#fff; padding:10px 12px; text-align:center; font-weight:500; position:sticky; top:0; z-index:10; }
td { padding:8px 12px; border:1px solid #e0e6ed; text-align:center; }
tr:nth-child(even) td { background:#f8fafc; }
td.num { text-align:right; font-family:Consolas,monospace; }
.empty { text-align:center; color:#999; padding:40px; font-size:14px; }
</style>
</head>
<body>
<div class="toolbar">
  <h1 id="title">汇总数据</h1>
  <button class="btn btn-green" onclick="copyAll()">📋 复制全部</button>
  <button class="btn" onclick="downloadCSV()">⬇ 下载CSV</button>
</div>
<div class="table-wrap">
  <table id="tbl"></table>
</div>
<script>
var rows = [];
(function(){
  try {
    rows = JSON.parse(localStorage.getItem('sheetRows') || '[]');
    var t = localStorage.getItem('sheetTitle') || '在线表格';
    document.getElementById('title').textContent = t;
    document.title = t;
  } catch(e){}

  if(!rows.length){
    document.getElementById('tbl').innerHTML = '<tr><td class="empty">没有数据，请回到主页面先汇总</td></tr>';
    return;
  }

  var html = '<thead><tr>';
  rows[0].forEach(function(h){ html += '<th>' + (h === '' ? ' ' : h) + '</th>'; });
  html += '</tr></thead><tbody>';
  for(var i = 1; i < rows.length; i++){
    html += '<tr>';
    rows[i].forEach(function(v){
      if(typeof v === 'number'){
        html += '<td class="num">' + v.toLocaleString('zh-CN', {minimumFractionDigits:2, maximumFractionDigits:2}) + '</td>';
      } else {
        html += '<td>' + (v === '' ? ' ' : v) + '</td>';
      }
    });
    html += '</tr>';
  }
  html += '</tbody>';
  document.getElementById('tbl').innerHTML = html;
})();

function copyAll(){
  var text = rows.map(function(r){ return r.join('\t'); }).join('\n');
  navigator.clipboard.writeText(text).then(function(){
    alert('已复制到剪贴板，可直接粘贴到Excel');
  }).catch(function(){
    var ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    alert('已复制到剪贴板');
  });
}

function downloadCSV(){
  var csv = '\ufeff' + rows.map(function(r){ return r.join(','); }).join('\n');
  var blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (document.title || '汇总') + '.csv';
  a.click();
}
</script>
</body>
</html>
