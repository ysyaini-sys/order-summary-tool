<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>投放数据汇总</title>
  <link rel="stylesheet" href="workspace.css">
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <style>
    .toufang-panel{padding:22px;margin-bottom:18px}.toufang-controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.toufang-controls label{font-size:13px;color:var(--workspace-muted)}.toufang-controls input{border:1px solid var(--workspace-line);border-radius:8px;padding:8px;background:#fff}.scope{display:flex;gap:8px;flex-wrap:wrap}.scope button,.action{border:1px solid var(--workspace-line);border-radius:8px;padding:9px 13px;background:#fff;color:var(--workspace-ink);cursor:pointer}.scope button[aria-pressed="true"],.action--primary{border-color:var(--workspace-blue);background:var(--workspace-blue);color:#fff}.action:disabled{opacity:.5;cursor:not-allowed}.toufang-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.upload-card{padding:18px;cursor:pointer;transition:border-color .15s,background-color .15s,box-shadow .15s}.upload-card:focus-visible{outline:3px solid rgba(0,113,227,.35);outline-offset:2px}.upload-card h2{margin:0;font-size:16px}.upload-card p{margin:7px 0 14px;color:var(--workspace-muted);font-size:13px}.upload-card input{display:none}.upload-card label{display:block;border:2px dashed #c7c7cc;border-radius:10px;padding:30px 12px;text-align:center;color:#4f5965;cursor:pointer;transition:.15s}.upload-card label:hover,.upload-card.dragover{border-color:var(--workspace-blue);background:#f4f8ff;box-shadow:0 0 0 3px rgba(0,113,227,.08)}.upload-card.dragover label{border-color:var(--workspace-blue);background:transparent}.upload-card label::before{content:'📥';display:block;font-size:24px;margin-bottom:7px}.file-list{display:grid;gap:6px;margin-top:12px}.file-item{display:flex;justify-content:space-between;gap:8px;padding:7px 9px;border-radius:7px;background:#f5f5f7;font-size:12px}.file-item button{border:0;background:none;color:#c5221f;cursor:pointer}.status{display:none;margin-top:14px;padding:10px 12px;border-radius:9px;font-size:13px}.status.show{display:block}.status.ok{background:#eaf7ef;color:#16733d}.status.warn{background:#fff7e8;color:#8a5a00}.status.err{background:#fff0f0;color:#b42318}.result-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.result-head h2{margin:0;font-size:17px}.result-head span{font-size:12px;color:var(--workspace-muted)}.result-wrap{display:flex;align-items:center;justify-content:space-between;gap:16px}.result-wrap .result-head{flex:1}.result-wrap .action[hidden]{display:none}.table-wrap{overflow:auto}.result-table{width:100%;border-collapse:collapse;font-size:13px}.result-table th{padding:11px;text-align:left;background:#f5f5f7;color:var(--workspace-muted);font-weight:600}.result-table td{padding:11px;border-bottom:1px solid var(--workspace-line)}.result-table td.num{text-align:right;font-variant-numeric:tabular-nums}.empty{padding:34px;text-align:center;color:var(--workspace-muted);border:1px dashed var(--workspace-line);border-radius:10px}@media(max-width:760px){.toufang-grid{grid-template-columns:1fr}.toufang-panel{padding:16px}.toufang-controls{align-items:flex-start}.toufang-controls label{width:100%}}
  </style>
</head>
<body class="workspace-page">
  <div class="workspace-shell">
    <aside class="workspace-sidebar" aria-label="工作区导航">
      <span class="workspace-sidebar__label">工作区</span>
      <nav aria-label="业务导航">
        <a href="index.html">订单汇总</a>
        <a href="toufang.html" aria-current="page">投放数据汇总</a>
        <a href="qianchuan.html" target="_blank" rel="noopener noreferrer">千川商品分析</a>
        <a href="detail-page.html" target="_blank" rel="noopener noreferrer">商品详情页项目</a>
        <a href="ai-assistant.html" target="_blank" rel="noopener noreferrer">AI 助手</a>
      </nav>
    </aside>
    <main class="workspace-main">
      <header class="workspace-page-heading"><h1>投放数据汇总</h1><p>选择投放报表后，按平台和日期在浏览器本地处理。</p></header>
      <section class="workspace-card toufang-panel" aria-label="汇总条件">
        <div class="toufang-controls">
          <div class="scope" aria-label="汇总范围">
            <button type="button" data-scope="all" aria-pressed="true">全部平台</button>
            <button type="button" data-scope="douyin" aria-pressed="false">抖音投放</button>
            <button type="button" data-scope="shipinhao" aria-pressed="false">视频号投放</button>
            <button type="button" data-scope="kuaishou" aria-pressed="false">快手投放</button>
            <button type="button" data-scope="other" aria-pressed="false">其他平台</button>
          </div>
          <label>开始日期 <input id="date-from" type="date"></label>
          <label>结束日期 <input id="date-to" type="date"></label>
          <button class="action" id="btn-automa-toufang" type="button">一键下载投放数据</button>
          <button class="action action--primary" id="summarize" type="button">一键汇总</button>
          <button class="action" id="export" type="button" disabled>导出明细</button>
        </div>
        <div class="status" id="status" role="status" aria-live="polite"></div>
      </section>
      <section class="toufang-grid" id="upload-grid" aria-label="投放报表上传"></section>
      <section class="workspace-card toufang-panel">
        <div class="result-wrap"><div class="result-head"><h2>投放汇总结果</h2><span>消耗、成交金额、订单数、ROI、转化成本</span></div><button class="action" id="explain-ai" type="button" disabled>AI 解读汇总</button><button class="action" id="open-sheet" type="button" disabled>📊 在线表格</button></div>
        <div id="result"><div class="empty">上传本地投放报表后，点击“一键汇总”。</div></div>
        <p class="workspace-muted">AI 解读仅发送平台汇总指标与日期范围，不发送商品、文件名或原始明细。</p>
        <pre id="ai-analysis" role="status" aria-live="polite" class="empty">完成汇总后，可选择让 AI 解读当前结果。</pre>
      </section>
    </main>
  </div>
  <script>
  (() => {
    const platforms = [
      { key: 'douyin', label: '抖音投放数据', tip: '巨量引擎 Excel / CSV 报表' },
      { key: 'shipinhao', label: '视频号投放数据', tip: '腾讯广告 Excel / CSV 报表' },
      { key: 'kuaishou', label: '快手投放数据', tip: '磁力引擎 Excel / CSV 报表' },
      { key: 'other', label: '其他投放数据', tip: '其他平台 Excel / CSV 报表' }
    ];
    const files = Object.fromEntries(platforms.map(platform => [platform.key, []]));
    const grid = document.getElementById('upload-grid');
    const statusNode = document.getElementById('status');
    let scope = 'all';
    let lastRows = [];
    let lastScope = 'all';
    let lastStart = '';
    let lastEnd = '';
    let analysisRequest = 0;

    const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
    const asNumber = value => { const number = Number(String(value ?? '').replace(/[¥￥,，\s]/g, '')); return Number.isFinite(number) ? number : 0; };
    const asDate = value => {
      if (value instanceof Date && !Number.isNaN(value.getTime())) {
        const year = value.getFullYear();
        const month = String(value.getMonth() + 1).padStart(2, '0');
        const day = String(value.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
      }
      const match = String(value ?? '').match(/(\d{4})[-/年](\d{1,2})[-/月](\d{1,2})/);
      return match ? `${match[1]}-${match[2].padStart(2, '0')}-${match[3].padStart(2, '0')}` : '';
    };
    const field = (row, expression) => { const key = Object.keys(row).find(name => expression.test(name)); return key ? row[key] : ''; };

    function showStatus(kind, message) { statusNode.className = `status show ${kind}`; statusNode.textContent = message; }
    function invalidateAiSummary() {
      document.getElementById('explain-ai').disabled = true;
      document.getElementById('ai-analysis').textContent = '汇总条件已变化，请重新汇总后再请求 AI 解读。';
      analysisRequest += 1;
    }
    function renderFiles(key) {
      const node = grid.querySelector(`[data-files="${key}"]`);
      node.innerHTML = files[key].map((file, index) => `<div class="file-item"><span>${escapeHtml(file.name)}</span><button type="button" data-remove="${key}" data-index="${index}">移除</button></div>`).join('');
      const onlineButton = grid.querySelector(`[data-online-sheet="${key}"]`);
      ToufangSheet.syncUploadButton(onlineButton, files[key].length);
    }
    function addFiles(key, list) {
      const selectedFiles = Array.from(list);
      const acceptedFiles = selectedFiles.filter(file => /\.(xlsx|xls|csv)$/i.test(file.name));
      if (acceptedFiles.length !== selectedFiles.length) showStatus('err', '只支持 .xlsx、.xls 或 .csv 文件，其他文件已忽略。');
      for (const file of acceptedFiles) {
        if (!files[key].some(item => item.name === file.name && item.size === file.size)) files[key].push(file);
      }
      if (acceptedFiles.length) {
        document.getElementById('open-sheet').disabled = true;
        document.getElementById('explain-ai').disabled = true;
        document.getElementById('ai-analysis').textContent = '报表已变化，请重新汇总后再请求 AI 解读。';
        analysisRequest += 1;
      }
      renderFiles(key);
    }
    grid.innerHTML = platforms.map(platform => `<article class="workspace-card upload-card" tabindex="0" aria-label="${platform.label}上传区域"><h2>${platform.label}</h2><p>${platform.tip}</p><label for="ad-file-${platform.key}">选择文件，或将文件拖到这里<input id="ad-file-${platform.key}" data-input="${platform.key}" type="file" accept=".xlsx,.xls,.csv" multiple></label><div class="file-list" data-files="${platform.key}"></div>${platform.key === 'douyin' ? '<button class="action online-sheet-button" type="button" data-online-sheet="douyin" hidden disabled>在线表格</button>' : ''}</article>`).join('');
    grid.querySelectorAll('[data-input]').forEach(input => input.addEventListener('change', event => { addFiles(event.target.dataset.input, event.target.files); event.target.value = ''; }));
    grid.querySelectorAll('.upload-card').forEach(card => {
      const input = card.querySelector('[data-input]');
      card.addEventListener('click', event => {
        if (event.target.closest('label, button, input')) return;
        input.click();
      });
      card.addEventListener('keydown', event => {
        if ((event.key === 'Enter' || event.key === ' ') && event.target === card) { event.preventDefault(); input.click(); }
      });
      card.addEventListener('dragenter', event => { event.preventDefault(); card.classList.add('dragover'); });
      card.addEventListener('dragover', event => { event.preventDefault(); if (event.dataTransfer) event.dataTransfer.dropEffect = 'copy'; });
      card.addEventListener('dragleave', event => {
        event.preventDefault();
        if (card.contains(event.relatedTarget)) return;
        card.classList.remove('dragover');
      });
      card.addEventListener('drop', event => {
        event.preventDefault(); card.classList.remove('dragover');
        addFiles(input.dataset.input, event.dataTransfer ? event.dataTransfer.files : []);
      });
    });
    grid.addEventListener('click', async event => {
      const onlineButton = event.target.closest('[data-online-sheet]');
      if (onlineButton) {
        scope = onlineButton.dataset.onlineSheet;
        document.querySelectorAll('[data-scope]').forEach(item => item.setAttribute('aria-pressed', String(item.dataset.scope === scope)));
        const hasRows = await summarizeAndRender();
        if (hasRows) document.getElementById('open-sheet').click();
        return;
      }
      const button = event.target.closest('[data-remove]');
      if (!button) return;
      files[button.dataset.remove].splice(Number(button.dataset.index), 1);
      document.getElementById('open-sheet').disabled = true;
      document.getElementById('explain-ai').disabled = true;
      document.getElementById('ai-analysis').textContent = '报表已变化，请重新汇总后再请求 AI 解读。';
      analysisRequest += 1;
      renderFiles(button.dataset.remove);
    });
    document.querySelectorAll('[data-scope]').forEach(button => button.addEventListener('click', () => { scope = button.dataset.scope; document.querySelectorAll('[data-scope]').forEach(item => item.setAttribute('aria-pressed', String(item === button))); invalidateAiSummary(); }));
    document.querySelectorAll('#date-from, #date-to').forEach(input => input.addEventListener('change', invalidateAiSummary));
    document.getElementById('btn-automa-toufang').addEventListener('click', () => {
      window.dispatchEvent(new CustomEvent('automa:execute-workflow', { detail: { publicId: 'toufang' } }));
      showStatus('ok', '已触发一键下载，请等待 Automa 完成投放数据下载。');
    });

    async function rowsFromFile(file) {
      const workbook = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
      return workbook.SheetNames.flatMap(name => XLSX.utils.sheet_to_json(workbook.Sheets[name], { defval: '' }));
    }
    async function summarize() {
      const wanted = scope === 'all' ? platforms.map(platform => platform.key) : [scope];
      const start = document.getElementById('date-from').value;
      const end = document.getElementById('date-to').value;
      const rows = []; let sourceRows = 0; let skipped = 0;
      for (const platform of platforms) {
        if (!wanted.includes(platform.key)) continue;
        for (const file of files[platform.key]) {
          const data = await rowsFromFile(file); sourceRows += data.length;
          const dailyData = ToufangSheet.excludeAllDateRows(data, row => field(row, /日期|时间/i));
          skipped += dailyData.excluded;
          for (const row of dailyData.rows) {
            const day = asDate(field(row, /日期|时间/i));
            if ((start || end) && !day) { skipped++; continue; }
            if ((start && day < start) || (end && day > end)) continue;
            const cost = asNumber(field(row, /整体消耗|消耗|成本|花费/i));
            const sales = asNumber(field(row, /净成交金额|成交金额|支付金额|成交/i));
            const orders = asNumber(field(row, /成交订单|支付订单|订单数/i));
            if (!cost && !sales && !orders) { skipped++; continue; }
            const productId = field(row, /商品ID|商品\s*ID|商品编码/i);
            const productName = field(row, /商品名称|商品名|商品标题/i);
            rows.push({ platform: platform.label, date: day || '未识别日期', cost, sales, orders, productId: String(productId ?? '').trim(), productName: String(productName ?? '').trim(), source: file.name });
          }
        }
      }
      return { rows, sourceRows, skipped };
    }
    function render(rows) {
      if (!rows.length) { document.getElementById('result').innerHTML = '<div class="empty">没有可汇总的数据。请检查上传的文件、日期范围和字段名称。</div>'; return; }
      const totals = new Map();
      rows.forEach(row => { const value = totals.get(row.platform) || { platform: row.platform, cost: 0, sales: 0, orders: 0 }; value.cost += row.cost; value.sales += row.sales; value.orders += row.orders; totals.set(row.platform, value); });
      const all = [...totals.values()];
      const grand = all.reduce((value, row) => ({ platform: '合计', cost: value.cost + row.cost, sales: value.sales + row.sales, orders: value.orders + row.orders }), { platform: '合计', cost: 0, sales: 0, orders: 0 });
      document.getElementById('result').innerHTML = `<div class="table-wrap"><table class="result-table"><thead><tr><th>平台</th><th>消耗（元）</th><th>成交金额（元）</th><th>订单数</th><th>ROI</th><th>转化成本（元）</th></tr></thead><tbody>${[...all, grand].map(row => `<tr><td>${escapeHtml(row.platform)}</td><td class="num">${row.cost.toFixed(2)}</td><td class="num">${row.sales.toFixed(2)}</td><td class="num">${row.orders}</td><td class="num">${row.cost ? (row.sales / row.cost).toFixed(2) : '—'}</td><td class="num">${row.orders ? (row.cost / row.orders).toFixed(2) : '—'}</td></tr>`).join('')}</tbody></table></div>`;
    }
    async function summarizeAndRender() {
      document.getElementById('explain-ai').disabled = true;
      document.getElementById('ai-analysis').textContent = '完成汇总后，可选择让 AI 解读当前结果。';
      analysisRequest += 1;
      try {
        showStatus('warn', '正在读取并汇总本地投放报表…');
        const result = await summarize();
        lastRows = result.rows;
        lastScope = scope;
        lastStart = document.getElementById('date-from').value;
        lastEnd = document.getElementById('date-to').value;
        render(lastRows);
        document.getElementById('export').disabled = !lastRows.length;
        document.getElementById('open-sheet').disabled = !lastRows.length;
        document.getElementById('explain-ai').disabled = !lastRows.length;
        showStatus(lastRows.length ? 'ok' : 'err', lastRows.length ? `已汇总 ${lastRows.length} 条有效明细（源数据 ${result.sourceRows} 行${result.skipped ? `，跳过 ${result.skipped} 行` : ''}）。` : '没有找到可汇总的数据。');
      } catch (error) {
        document.getElementById('open-sheet').disabled = true;
        showStatus('err', `汇总失败：${error.message}`);
      }
      return lastRows.length > 0;
    }
    document.getElementById('summarize').addEventListener('click', summarizeAndRender);
    document.getElementById('explain-ai').addEventListener('click', async event => {
      if (!lastRows.length) return;
      const button = event.currentTarget;
      const requestId = ++analysisRequest;
      button.disabled = true;
      document.getElementById('ai-analysis').textContent = '正在请求 AI 解读…';
      const summary = ToufangSheet.buildAiSummary(lastRows, lastScope, lastStart, lastEnd);
      try {
        const response = await fetch('/api/assistant', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({
            task: '请解释这份投放汇总数据：概括平台表现，指出值得关注的差异和数据限制，不要推断未提供的信息，也不要建议直接修改投放。ROI 和转化成本以给定汇总为准。',
            project: { reportType: 'ad-summary', summary }
          })
        });
        const result = await response.json();
        if (requestId !== analysisRequest) return;
        if (!response.ok) throw new Error(result.message || 'AI 服务暂不可用。');
        document.getElementById('ai-analysis').textContent = result.response?.output_text || 'AI 未返回可显示的文字结果。';
      } catch (error) {
        if (requestId === analysisRequest) {
          const message = error instanceof TypeError
            ? '无法连接本机 AI 服务。请先启动服务，并通过 http://127.0.0.1:8787/toufang.html 打开此页面。'
            : error.message;
          document.getElementById('ai-analysis').textContent = `AI 解读失败：${message}`;
        }
      } finally {
        if (requestId === analysisRequest) button.disabled = false;
      }
    });
    document.getElementById('open-sheet').addEventListener('click', () => {
      if (!lastRows.length) return;
      let rows;
      if (lastScope === 'douyin') {
        if (lastRows.some(row => !row.productId || !row.productName)) {
          showStatus('err', '抖音报表缺少商品ID或商品名称字段，无法生成截图样式的商品明细表。');
          return;
        }
        rows = ToufangSheet.buildDouyinSheetRows(lastRows);
      } else {
        rows = ToufangSheet.buildPlatformSummaryRows(lastRows);
      }
      try {
        localStorage.setItem('sheetTitle', '投放汇总');
        localStorage.setItem('sheetSheets', JSON.stringify([{ name: '投放汇总', rows }]));
        const opened = window.open('sheet.html', '_blank');
        if (!opened) showStatus('err', '浏览器拦截了新窗口，请允许此网站打开弹出窗口后重试。');
      } catch (error) { showStatus('err', `打开在线表格失败：${error.message}`); }
    });
    document.getElementById('export').addEventListener('click', () => { if (!lastRows.length) return; const sheet = XLSX.utils.json_to_sheet(lastRows); const workbook = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(workbook, sheet, '投放明细'); XLSX.writeFile(workbook, `投放数据汇总_${new Date().toISOString().slice(0, 10)}.xlsx`); });
  })();
  </script>
  <script src="toufang-sheet.js"></script>
</body>
</html>
