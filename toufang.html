<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投放数据汇总 · 电商个人工作站</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root{--ink:#1d1d1f;--muted:#6e6e73;--line:#e8e8ed;--canvas:#f5f5f7;--blue:#0071e3;--green:#1d9a57;--shadow:0 12px 34px rgba(29,29,31,.06)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fafbfc,#f2f5f8);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,input{font:inherit}.shell{max-width:1440px;margin:0 auto;padding:0 34px 48px}.nav{height:64px;display:flex;align-items:center;gap:28px;border-bottom:1px solid var(--line)}.nav a{text-decoration:none;color:#697383;font-size:14px}.nav a[aria-current=page]{color:var(--ink);font-weight:600}.brand{font-weight:700!important;color:var(--ink)!important;font-size:18px!important;margin-right:14px}.nav-note{margin-left:auto;color:var(--muted);font-size:12px}.hero{display:flex;justify-content:space-between;align-items:end;padding:38px 0 24px}.eyebrow{color:var(--muted);font-size:12px;letter-spacing:.08em}.hero h1{margin:7px 0 5px;font-size:38px;letter-spacing:-.04em}.hero p{margin:0;color:var(--muted);font-size:15px}.actions{display:flex;gap:10px}.btn{border:1px solid #d6dce4;border-radius:9px;padding:11px 17px;background:#fff;color:#334055;cursor:pointer;box-shadow:0 2px 5px rgba(24,39,58,.04)}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 6px 16px rgba(0,113,227,.22)}.btn:disabled{opacity:.55;cursor:not-allowed}.panel{background:rgba(255,255,255,.92);border:1px solid rgba(231,235,240,.9);border-radius:16px;box-shadow:var(--shadow);padding:22px;margin-bottom:18px}.scope{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.scope strong{font-size:14px}.pill{border:1px solid #dce2ea;background:#fff;color:#657184;border-radius:999px;padding:8px 14px;cursor:pointer}.pill.active{border-color:#8bbcf0;background:#edf6ff;color:#0969c7;font-weight:600}.date{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}.date input{border:1px solid #dce2ea;border-radius:8px;padding:8px 10px;color:#3a4655;background:#fff}.upload-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.upload-card{border:1px solid #e5e9ef;border-radius:13px;padding:17px;min-height:220px}.upload-card h3{font-size:16px;margin:0 0 4px}.upload-card p{font-size:12px;color:var(--muted);margin:0 0 14px}.drop{border:1px dashed #cbd5e2;border-radius:11px;min-height:96px;display:flex;align-items:center;justify-content:center;text-align:center;color:#718096;font-size:13px;cursor:pointer;background:#fcfdff}.drop:hover,.drop.drag{border-color:var(--blue);background:#f5f9ff}.files{margin-top:10px;max-height:86px;overflow:auto}.file{display:flex;justify-content:space-between;gap:8px;padding:6px 8px;border-radius:7px;background:#f4f7fa;font-size:11px;margin-top:5px}.file button{border:0;background:none;color:#b42318;cursor:pointer}.result-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.result-head h2{font-size:18px;margin:0}.hint{color:var(--muted);font-size:12px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th{background:#f0f3f7;color:#637085;text-align:left;padding:11px 10px;font-weight:600}td{padding:11px 10px;border-bottom:1px solid #edf0f4}td.num{text-align:right;font-variant-numeric:tabular-nums}.empty{text-align:center;color:var(--muted);padding:55px 20px;border:1px dashed #dbe2ea;border-radius:12px}.status{margin-top:12px;padding:10px 12px;border-radius:9px;font-size:13px;display:none}.status.show{display:block}.status.ok{background:#eaf7ef;color:#16733d}.status.err{background:#fff0f0;color:#b42318}.status.warn{background:#fff8e6;color:#8a5a00}@media(max-width:1050px){.upload-grid{grid-template-columns:repeat(2,1fr)}.hero{align-items:start;gap:18px;flex-direction:column}.date{margin-left:0}}@media(max-width:650px){.shell{padding:0 16px 32px}.nav{gap:15px;overflow:auto}.nav-note{display:none}.hero h1{font-size:30px}.upload-grid{grid-template-columns:1fr}.scope{align-items:flex-start}.date{width:100%;flex-wrap:wrap}}
</style>
</head>
<body>
<div class="shell">
<nav class="nav" aria-label="主导航"><a class="brand" href="index.html">电商个人工作站</a><a href="index.html">订单汇总</a><a href="toufang.html" aria-current="page">投放数据汇总</a><a href="qianchuan.html" target="_blank" rel="noopener">千川分析 ↗</a><span class="nav-note">投放数据与订单数据使用不同计算逻辑</span></nav>
<header class="hero"><div><div class="eyebrow">WORKSPACE · 2026.09.28</div><h1>投放数据汇总</h1><p>按投放平台汇总消耗、成交与投产数据，支持多平台或单平台汇总。</p></div><div class="actions"><button class="btn primary" id="summarize">一键汇总投放数据</button><button class="btn" id="export" disabled>导出汇总结果</button></div></header>
<section class="panel"><div class="scope"><strong>汇总范围</strong><button class="pill active" data-scope="all">全部投放平台</button><button class="pill" data-scope="douyin">抖音投放</button><button class="pill" data-scope="shipinhao">视频号投放</button><button class="pill" data-scope="kuaishou">快手投放</button><div class="date"><span>日期</span><input id="date-from" type="date"><span>至</span><input id="date-to" type="date"></div></div></section>
<section class="panel"><div class="upload-grid" id="upload-grid"></div><div id="status" class="status" role="status" aria-live="polite"></div></section>
<section class="panel"><div class="result-head"><h2>投放汇总结果</h2><span class="hint">消耗、成交金额、成交订单、ROI、转化成本</span></div><div id="result"><div class="empty">请先上传投放报表，再点击“一键汇总投放数据”。<br>可汇总多个平台，也可单独汇总当前平台。</div></div></section>
</div>
<script>
(() => {
  const platforms=[['douyin','抖音投放数据','支持巨量引擎报表'],['shipinhao','视频号投放数据','支持腾讯广告报表'],['kuaishou','快手投放数据','支持快手磁力引擎报表'],['other','其他投放数据','支持其他平台报表']];
  const files=Object.fromEntries(platforms.map(([key])=>[key,[]]));
  let scope='all', lastRows=[];
  const $=id=>document.getElementById(id);
  const grid=$('upload-grid');
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  grid.innerHTML=platforms.map(([key,label,desc])=>`<article class="upload-card"><h3>${label}</h3><p>${desc} · Excel / CSV</p><div class="drop" data-drop="${key}">点击上传或拖拽文件到这里</div><input class="file-input" data-input="${key}" type="file" multiple accept=".xlsx,.xls,.csv" hidden><div class="files" data-files="${key}"></div></article>`).join('');
  function status(kind,msg){const el=$('status');el.className='status show '+kind;el.textContent=msg}
  function renderFiles(key){$("[data-files='"+key+"']").innerHTML=files[key].map((f,i)=>`<div class="file"><span title="${esc(f.name)}">${esc(f.name)}</span><button data-remove="${key}" data-index="${i}" aria-label="移除文件">×</button></div>`).join('')}
  function add(key,list){for(const file of list){if(!files[key].some(x=>x.name===file.name&&x.size===file.size))files[key].push(file)}renderFiles(key);status('ok',`已添加 ${files[key].length} 个${platforms.find(x=>x[0]===key)[1]}文件`)}
  platforms.forEach(([key])=>{const drop=$("[data-drop='"+key+"']"),input=$("[data-input='"+key+"']");drop.onclick=()=>input.click();input.onchange=()=>add(key,input.files);['dragenter','dragover'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.remove('drag')}));drop.ondrop=e=>add(key,e.dataTransfer.files)});
  grid.onclick=e=>{const b=e.target.closest('[data-remove]');if(!b)return;files[b.dataset.remove].splice(Number(b.dataset.index),1);renderFiles(b.dataset.remove)};
  document.querySelectorAll('[data-scope]').forEach(btn=>btn.onclick=()=>{scope=btn.dataset.scope;document.querySelectorAll('[data-scope]').forEach(x=>x.classList.toggle('active',x===btn))});
  function text(v){return String(v??'').trim()}
  function num(v){const n=Number(text(v).replace(/,/g,''));return Number.isFinite(n)?n:0}
  function date(v){const s=text(v),m=s.match(/(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);return m?`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`:''}
  async function read(file){if(/\.csv$/i.test(file.name)){const rows=(await file.text()).trim().split(/\r?\n/).map(line=>line.split(','));return rows}else{const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''})}}
  function normalize(rows,platform,fileName){if(!rows.length)return[];if(Array.isArray(rows[0])){const headers=rows[0].map(text);return rows.slice(1).map(r=>Object.fromEntries(headers.map((h,i)=>[h,r[i]??''])))}return rows}
  async function aggregate(){const wanted=scope==='all'?platforms.map(x=>x[0]):[scope];const from=$('date-from').value,to=$('date-to').value;const output=[];let count=0;for(const [key,label] of platforms){if(!wanted.includes(key))continue;for(const file of files[key]){const data=normalize(await read(file),key,file.name);count+=data.length;for(const row of data){const get=(regex)=>{const k=Object.keys(row).find(x=>regex.test(x));return k?row[k]:''};const day=date(get(/日期|时间/i));if(!day||day==='全部'||(from&&day<from)||(to&&day>to))continue;const cost=num(get(/整体消耗|消耗|成本|花费/i));const sales=num(get(/净成交金额|成交金额|支付金额|成交/i));const orders=num(get(/成交订单|支付订单|订单数/i));if(cost===0&&sales===0&&orders===0)continue;output.push({platform:label,date:day,cost,sales,orders,roi:cost?sales/cost:0,conversionCost:orders?cost/orders:0,source:file.name})}}}return {rows:output,count}}
  function render(rows){if(!rows.length){$('result').innerHTML='<div class="empty">没有解析到可汇总的数据，请检查文件格式、日期和字段。</div>';return}const map=new Map();for(const r of rows){const k=r.platform;const x=map.get(k)||{platform:k,cost:0,sales:0,orders:0};x.cost+=r.cost;x.sales+=r.sales;x.orders+=r.orders;map.set(k,x)}const total=[...map.values()].reduce((x,r)=>({cost:x.cost+r.cost,sales:x.sales+r.sales,orders:x.orders+r.orders}),{cost:0,sales:0,orders:0});const all=[...map.values(),{platform:'合计',...total}];$('result').innerHTML=`<div class="table-wrap"><table><thead><tr><th>平台</th><th>消耗（元）</th><th>成交金额（元）</th><th>成交订单（单）</th><th>ROI</th><th>转化成本（元）</th></tr></thead><tbody>${all.map(r=>`<tr><td>${esc(r.platform)}</td><td class="num">${r.cost.toFixed(2)}</td><td class="num">${r.sales.toFixed(2)}</td><td class="num">${r.orders}</td><td class="num">${r.cost?(r.sales/r.cost).toFixed(2):'—'}</td><td class="num">${r.orders?(r.cost/r.orders).toFixed(2):'—'}</td></tr>`).join('')}</tbody></table></div>`}
  $('summarize').onclick=async()=>{try{status('warn','正在独立计算投放数据，请稍候…');const result=await aggregate();lastRows=result.rows;render(lastRows);$('export').disabled=!lastRows.length;status(lastRows.length?'ok':'err',lastRows.length?`汇总完成：${lastRows.length} 条投放明细，来自 ${result.count} 行源数据。`:'没有可汇总数据。')}catch(e){status('err','汇总失败：'+e.message)}};
  $('export').onclick=()=>{if(!lastRows.length)return;const ws=XLSX.utils.json_to_sheet(lastRows);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'投放明细');XLSX.writeFile(wb,'投放数据汇总_'+new Date().toISOString().slice(0,10)+'.xlsx')};
})();
</script>
</body>
</html>
