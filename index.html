<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电商订单汇总工具</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, "Microsoft YaHei", sans-serif; background:#f5f7fa; color:#333; height:100vh; overflow:hidden; display:flex; flex-direction:column; }
.header { background:linear-gradient(135deg,#4472C4,#2f5597); color:#fff; padding:10px 20px; flex-shrink:0; }
.header h1 { font-size:16px; font-weight:600; }
.header p { font-size:11px; opacity:.85; margin-top:2px; }
.container { flex:1; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:10px; padding:10px; overflow:hidden; }
.section { background:#fff; border-radius:8px; padding:12px; box-shadow:0 1px 3px rgba(0,0,0,.06); display:flex; flex-direction:column; overflow:hidden; }
.section-head { display:flex; align-items:center; gap:8px; margin-bottom:8px; padding-bottom:6px; border-bottom:2px solid #e8ecf1; flex-shrink:0; }
.section-head .icon { font-size:18px; }
.section-head h2 { font-size:13px; color:#2f5597; }
.section-head .sub { font-size:10px; color:#999; margin-left:auto; }
.upload-zone { border:2px dashed #c5d0e0; border-radius:6px; padding:12px; text-align:center; cursor:pointer; transition:.2s; flex-shrink:0; }
.upload-zone:hover, .upload-zone.dragover { border-color:#4472C4; background:#f0f5ff; }
.upload-zone p { color:#888; font-size:12px; }
.upload-zone .icon { font-size:20px; margin-bottom:2px; }
.file-list { margin-top:6px; max-height:40px; overflow-y:auto; flex-shrink:0; }
.file-item { background:#f0f5ff; padding:3px 8px; border-radius:4px; margin-top:3px; font-size:11px; display:flex; justify-content:space-between; align-items:center; }
.file-item .rm { cursor:pointer; color:#e74c3c; font-weight:bold; }
.controls { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:8px; flex-shrink:0; }
.controls select { padding:5px 8px; border:1px solid #d0d7e2; border-radius:4px; font-size:12px; min-width:120px; }
.date-badge { display:inline-block; background:#e8f5e9; color:#2e7d32; padding:3px 8px; border-radius:4px; font-size:12px; font-weight:500; }
.btn { background:#4472C4; color:#fff; border:none; padding:6px 14px; border-radius:4px; cursor:pointer; font-size:12px; font-weight:500; transition:.2s; }
.btn:hover { background:#36569e; }
.btn:disabled { background:#a0b4d4; cursor:not-allowed; }
.btn-secondary { background:#fff; color:#4472C4; border:1px solid #4472C4; }
.btn-secondary:hover { background:#f0f5ff; }
.btn-automa { background:#e67e22; }
.btn-automa:hover { background:#d35400; }
.btn-sheet { background:#00b96b; }
.btn-sheet:hover { background:#009a59; }
.result-msg { padding:6px 10px; border-radius:4px; margin-top:8px; font-size:11px; flex-shrink:0; }
.result-msg.ok { background:#e8f5e9; color:#2e7d32; }
.result-msg.err { background:#fdecea; color:#c62828; }
.result-msg.warn { background:#fff8e1; color:#f57f17; }
.result-box { display:none; margin-top:8px; border-top:1px solid #e8ecf1; padding-top:8px; flex:1; overflow-y:auto; }
.result-box.show { display:flex; flex-direction:column; }
.stats { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:4px; flex-shrink:0; }
.stat { background:#f0f5ff; padding:5px 10px; border-radius:4px; }
.stat .label { font-size:10px; color:#888; }
.stat .value { font-size:14px; font-weight:600; color:#2f5597; margin-top:1px; }
table { width:100%; border-collapse:collapse; font-size:11px; }
th { background:#4472C4; color:#fff; padding:4px 6px; text-align:center; font-weight:500; position:sticky; top:0; }
td { padding:3px 6px; border:1px solid #e0e6ed; text-align:center; }
tr:nth-child(even) td { background:#f8fafc; }
td.num { text-align:right; font-family:Consolas,monospace; }
.table-wrap { overflow:auto; flex:1; }
@media (max-width:768px){
  body { overflow:auto; height:auto; }
  .container { grid-template-columns:1fr; grid-template-rows:auto; }
}
</style>
</head>
<body>
<div class="header">
  <h1>电商订单汇总工具</h1>
  <p>数据汇总 · 抖音 · 视频号 · 快手（同一页面，独立运行）</p>
</div>
<div class="container">
  <div class="section">
    <div class="section-head">
      <span class="icon">📊</span>
      <h2>投放数据汇总</h2>
      <span class="sub">多文件合并</span>
    </div>
    <div class="upload-zone" id="upload-summary">
      <div class="icon">📤</div>
      <p>点击或拖拽上传 .xlsx 文件</p>
    </div>
    <div class="file-list" id="file-list-summary"></div>
    <div class="controls">
      <button class="btn btn-automa" id="btn-automa-toufang">🚀 一键下载</button>
      <button class="btn" id="btn-process-summary">开始汇总</button>
      <button class="btn btn-secondary" id="btn-download-summary" style="display:none;">下载</button>

      <div class="stats" id="stats-summary"></div>

  <div class="section">

    </div>
    <div class="controls">

      <button class="btn btn-secondary" id="btn-download-douyin" style="display:none;">下载</button>
      <button class="btn btn-sheet" id="btn-sheet-douyin" style="display:none;">📊 在线表格</button>
    </div>
    <div id="msg-douyin"></div>
    <div class="result-box" id="result-douyin">
      <div class="stats" id="stats-douyin"></div>

  <div class="section">
    <div class="section-head">

    </div>
    <div class="upload-zone" id="upload-shipinhao">
      <div class="icon">📤</div>
      <p>点击或拖拽上传 .csv / .xlsx</p>
    </div>
    <div class="file-list" id="file-list-shipinhao"></div>
    <div class="controls" id="date-area-shipinhao">
      <span style="color:#999;font-size:12px;">上传后自动识别日期</span>
    </div>
    <div class="controls">
      <button class="btn" id="btn-process-shipinhao" disabled>开始汇总</button>
      <button class="btn btn-secondary" id="btn-download-shipinhao" style="display:none;">下载</button>
      <button class="btn btn-sheet" id="btn-sheet-shipinhao" style="display:none;">📊 在线表格</button>
    </div>
    <div id="msg-shipinhao"></div>
    <div class="result-box" id="result-shipinhao">
      <div class="stats" id="stats-shipinhao"></div>
      <div class="table-wrap"><table id="table-shipinhao"></table></div>
    </div>
  </div>
  <div class="section">
    <div class="section-head">

    <div class="upload-zone" id="upload-kuaishou">

      <p>点击或拖拽上传 .xlsx</p>
    </div>
    <div class="file-list" id="file-list-kuaishou"></div>
    <div class="controls" id="date-area-kuaishou">
      <span style="color:#999;font-size:12px;">上传后自动识别日期</span>
    </div>
    <div class="controls">
      <button class="btn" id="btn-process-kuaishou" disabled>开始汇总</button>
      <button class="btn btn-secondary" id="btn-download-kuaishou" style="display:none;">下载</button>
      <button class="btn btn-sheet" id="btn-sheet-kuaishou" style="display:none;">📊 在线表格</button>
    </div>
    <div id="msg-kuaishou"></div>
    <div class="result-box" id="result-kuaishou">

<script>
const CANNED_IDS = ['3823309765342266082','3697193324864733221','3697191108854546926','3697171044847714581','3692684294234439935'];
const SPECIAL_ID = '3823309765342266082';
const COMBO_PAIRS = [
  ['山葡萄原汁1箱+冰白葡萄原汁1箱320ml*12罐(到手12罐)','冰白葡萄原汁1箱320ml*6罐+山葡萄原汁1箱320ml*6瓶罐320ml*12罐(到手12罐)'],
  ['冰白葡萄原汁1箱320ml*6瓶+山葡萄原汁1箱320ml*6瓶(到手12瓶)','山葡萄原汁1箱320ml*6瓶+冰白葡萄原汁1箱320ml*6瓶(到手12瓶)']
];

function openSpreadsheet(title, sheets) {
  try {
    localStorage.setItem('sheetTitle', title);
    localStorage.setItem('sheetSheets', JSON.stringify(sheets));
    window.open('sheet.html', '_blank');
  } catch(e) {
    alert('打开表格失败：' + e.message);
  }
}

function setupUpload(tab, onFilesChanged){
  const zone = document.getElementById('upload-'+tab);
  const list = document.getElementById('file-list-'+tab);
  let files = [];
  zone.addEventListener('click',()=>{
    const inp = document.createElement('input');
    inp.type='file'; inp.multiple=true;
    inp.accept = tab==='summary' ? '.xlsx' : '.csv,.xlsx';
    inp.onchange = e=>{ addFiles(e.target.files); };
    inp.click();
  });
  zone.addEventListener('dragover',e=>{ e.preventDefault(); zone.classList.add('dragover'); });
  zone.addEventListener('dragleave',()=>zone.classList.remove('dragover'));
  zone.addEventListener('drop',e=>{ e.preventDefault(); zone.classList.remove('dragover'); addFiles(e.dataTransfer.files); });
  function addFiles(fl){
    for(const f of fl){
      files.push(f);
      const div = document.createElement('div');
      div.className='file-item';
      div.innerHTML = '<span>📄 '+f.name+' ('+(f.size/1024).toFixed(1)+'KB)</span><span class="rm">✕</span>';
      div.querySelector('.rm').onclick=()=>{ files=files.filter(x=>x!==f); div.remove(); if(onFilesChanged) onFilesChanged(files); };
      list.appendChild(div);
    }
    if(onFilesChanged) onFilesChanged(files);
  }
  return { getFiles:()=>files };
}
function showMsg(tab,type,text){ document.getElementById('msg-'+tab).innerHTML='<div class="result-msg '+type+'">'+text+'</div>'; }
function readFile(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{ try{ resolve(XLSX.read(new Uint8Array(e.target.result),{type:'array',cellDates:true})); }catch(err){reject(err);} };
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}
function sheetToJson(ws){ return XLSX.utils.sheet_to_json(ws,{defval:''}); }
function showResult(tab, show){ document.getElementById('result-'+tab).classList.toggle('show', show); }
const uploads = { summary: setupUpload('summary') };

document.getElementById('btn-process-summary').addEventListener('click', async ()=>{
  const files = uploads.summary.getFiles();
  if(files.length===0){ showMsg('summary','err','请先上传文件'); return; }
  showMsg('summary','warn','正在处理...');
  try {
    let allRows=[], fileCount=files.length;
    for(const f of files){
      const wb = await readFile(f);
      for(const sn of wb.SheetNames){
        const rows = sheetToJson(wb.Sheets[sn]);
        for(const r of rows){
          const dateCol = Object.keys(r).find(k=>/日期|时间/i.test(k));
          if(!dateCol) continue;
          const dv = String(r[dateCol]).trim();
          if(dv==='全部'||dv==='') continue;
          const idCol = Object.keys(r).find(k=>/商品ID|商品id/i.test(k));
          const nameCol = Object.keys(r).find(k=>/商品名称|商品名/i.test(k));
          const costCol = Object.keys(r).find(k=>/整体消耗|消耗/i.test(k));
          if(!idCol||!costCol) continue;
          allRows.push({id:String(r[idCol]).trim(), name:nameCol?String(r[nameCol]).trim():'', date:dv, cost:parseFloat(String(r[costCol]).replace(/,/g,''))||0, source:f.name});
        }
      }
    }
    if(allRows.length===0){ showMsg('summary','err','未解析到有效数据'); return; }
    const seen=new Set(), dupes=[];
    for(const r of allRows){ const k=r.source+'|'+r.id; if(seen.has(k)) dupes.push(r); seen.add(k); }
    if(dupes.length>0){ showMsg('summary','err','发现 '+dupes.length+' 条重复数据，已停止处理。'); return; }
    const groups={};
    for(const r of allRows){ if(!groups[r.id]) groups[r.id]={id:r.id,name:r.name,total:0,dates:[]}; groups[r.id].total+=r.cost; groups[r.id].dates.push(r); }
    let result = Object.values(groups).map(g=>({...g, pkg:CANNED_IDS.includes(g.id)?'罐装':'瓶装'}));
    result.sort((a,b)=>{ if(a.pkg!==b.pkg) return a.pkg==='罐装'?-1:1; if(a.id!==b.id) return a.id<b.id?-1:1; return 0; });
    let flatRows=[];
    let cannedWritten=false, bottledWritten=false;
    for(const g of result){
      const dates = g.dates.sort((a,b)=>a.date.localeCompare(b.date));
      dates.forEach((d,i)=>{
        let pkgVal='';
        if(i===0){
          if(g.pkg==='罐装' && !cannedWritten){ pkgVal='罐装'; cannedWritten=true; }
          else if(g.pkg==='瓶装' && !bottledWritten){ pkgVal='瓶装'; bottledWritten=true; }
        }
        flatRows.push({pkg:pkgVal, id:i===0?g.id:'', name:i===0?g.name:'', date:d.date, cost:d.cost.toFixed(2), total:i===0?g.total.toFixed(2):''});
      });
    }
    showResult('summary', true);
    document.getElementById('stats-summary').innerHTML='<div class="stat"><div class="label">文件</div><div class="value">'+fileCount+'</div></div><div class="stat"><div class="label">记录</div><div class="value">'+allRows.length+'</div></div><div class="stat"><div class="label">总消耗</div><div class="value">¥'+allRows.reduce((s,r)=>s+r.cost,0).toFixed(2)+'</div></div>';
    const tbl=document.getElementById('table-summary');
    tbl.innerHTML='<thead><tr><th>包装</th><th>商品ID</th><th>商品名称</th><th>日期</th><th>整体消耗</th><th>总消耗</th></tr></thead>';
    const tb=document.createElement('tbody');
    flatRows.forEach(r=>{ tb.innerHTML+='<tr><td>'+r.pkg+'</td><td style="font-family:Consolas">'+r.id+'</td><td>'+r.name+'</td><td>'+r.date+'</td><td class="num">'+r.cost+'</td><td class="num">'+r.total+'</td></tr>'; });
    tbl.appendChild(tb);
    window._summaryData=flatRows;
    document.getElementById('btn-download-summary').style.display='inline-block';
    document.getElementById('btn-sheet-summary').style.display='inline-block';
    showMsg('summary','ok','完成：'+allRows.length+' 条记录，'+Object.keys(groups).length+' 个商品');
  } catch(err){ showMsg('summary','err','处理失败：'+err.message); }
});
document.getElementById('btn-sheet-summary').addEventListener('click', ()=>{
  if(!window._summaryData) return;
  const rows = [['包装','商品ID','商品名称','日期','整体消耗','总消耗']];
  window._summaryData.forEach(r=>{ rows.push([r.pkg, String(r.id), r.name, r.date, parseFloat(r.cost), r.total?parseFloat(r.total):'']); });
  openSpreadsheet('投放数据汇总', [{name: '汇总', rows: rows}]);
});
document.getElementById('btn-download-summary').addEventListener('click',()=>{
  if(!window._summaryData) return;
  const ws=XLSX.utils.json_to_sheet(window._summaryData);
  ws['!cols']=[{wch:8},{wch:24},{wch:55},{wch:12},{wch:14},{wch:14}];
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'汇总');
  XLSX.writeFile(wb,'数据汇总_'+new Date().toISOString().slice(0,10)+'.xlsx');
});

function getMultiplier(spec){
  if(/30[瓶罐]/.test(spec)) return 5;
  if(/24[瓶罐]/.test(spec)) return 1;
  if(/12[瓶罐]/.test(spec)) return 2;
  return 1;
}
async function detectDates(files){
  const dateSet = new Set();
  for(const f of files){
    const wb = await readFile(f);
    for(const sn of wb.SheetNames){
      const rows = sheetToJson(wb.Sheets[sn]);
      for(const r of rows){
        const dateCol = Object.keys(r).find(k=>/支付完成时间|订单支付时间|支付时间/i.test(k));
        if(!dateCol) continue;
        const dv = r[dateCol];
        let rowDate = '';
        if(dv instanceof Date){ rowDate = dv.toISOString().slice(0,10); }
        else { const s = String(dv).trim(); const m = s.match(/(\d{4})[-/](\d{1,2})[-/](\d{1,2})/); if(m) rowDate = m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0'); }
        if(rowDate) dateSet.add(rowDate);
      }
    }
  }
  return [...dateSet].sort();
}
['douyin','shipinhao','kuaishou'].forEach(tab=>{
  let selectedDate = null;
  uploads[tab] = setupUpload(tab, async (files)=>{
    const btn = document.getElementById('btn-process-'+tab);
    const area = document.getElementById('date-area-'+tab);
    if(files.length===0){ area.innerHTML = '<span style="color:#999;font-size:12px;">上传后自动识别日期</span>'; btn.disabled = true; selectedDate = null; return; }
    btn.disabled = true;
    area.innerHTML = '<span style="color:#999;font-size:12px;">识别日期中...</span>';
    try {
      const dates = await detectDates(files);
      if(dates.length===0){ area.innerHTML = '<span style="color:#c62828;font-size:12px;">未识别到日期</span>'; return; }
      selectedDate = dates[dates.length-1];
      if(dates.length===1){ area.innerHTML = '📅 <span class="date-badge">'+dates[0]+'</span>'; }
      else { let opts = dates.map(d=>'<option value="'+d+'"'+(d===selectedDate?' selected':'')+'>'+d+'</option>').join(''); area.innerHTML = '📅 <select id="date-select-'+tab+'">'+opts+'</select>'; document.getElementById('date-select-'+tab).addEventListener('change', e=>{ selectedDate = e.target.value; }); }
      btn.disabled = false;
    } catch(err){ area.innerHTML = '<span style="color:#c62828;font-size:12px;">日期识别失败</span>'; }
  });
  document.getElementById('btn-process-'+tab).addEventListener('click', async ()=>{
    const files = uploads[tab].getFiles();
    if(files.length===0){ showMsg(tab,'err','请先上传文件'); return; }
    if(!selectedDate){ showMsg(tab,'err','未识别到日期'); return; }
    const targetDate = selectedDate;
    showMsg(tab,'warn','正在处理 '+targetDate+'...');
    try {
      let perFileResults = [];
      let totalClosed = 0, grandAmount = 0;
      for(const f of files){
        const wb=await readFile(f);
        let fileRows=[];
        for(const sn of wb.SheetNames){
          const rows=sheetToJson(wb.Sheets[sn]);
          for(const r of rows){
            const dateCol=Object.keys(r).find(k=>/支付完成时间|订单支付时间|支付时间/i.test(k));
            const idCol=Object.keys(r).find(k=>/商品ID|商品id/i.test(k));
            const specCol=Object.keys(r).find(k=>/商品规格|规格/i.test(k));
            const qtyCol=Object.keys(r).find(k=>/商品数量|成交数量|数量/i.test(k));
            const priceCol=Object.keys(r).find(k=>/商品单价|单价/i.test(k));
            const statusCol=Object.keys(r).find(k=>/订单状态|交易状态|状态/i.test(k));
            if(!idCol||!qtyCol) continue;
            if(statusCol){ const st=String(r[statusCol]).trim(); if(st==='已关闭'||st==='交易关闭'||st==='已取消'){ totalClosed++; continue; } }
            if(dateCol){ const dv=r[dateCol]; let rowDate=''; if(dv instanceof Date){ rowDate=dv.toISOString().slice(0,10); } else { const s=String(dv).trim(); const m=s.match(/(\d{4})[-/](\d{1,2})[-/](\d{1,2})/); if(m) rowDate=m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0'); } if(rowDate!==targetDate) continue; }
            const qty=parseFloat(String(r[qtyCol]).replace(/,/g,''))||0;
            const price=priceCol?(parseFloat(String(r[priceCol]).replace(/,/g,''))||0):0;
            fileRows.push({id:String(r[idCol]).trim(), spec:specCol?String(r[specCol]).trim():'', qty:qty, amount:price*qty});
          }
        }
        if(fileRows.length===0) continue;
        const groups={};
        for(const r of fileRows){ const k=r.id+'|'+r.spec; if(!groups[k]) groups[k]={id:r.id,spec:r.spec,qty:0,amount:0}; groups[k].qty+=r.qty; groups[k].amount+=r.amount; }
        let grouped=Object.values(groups).sort((a,b)=>{ if(a.id!==b.id) return a.id<b.id?-1:1; return a.spec.localeCompare(b.spec); });
        const usedCombo=new Set(), comboMap={};
        for(const pair of COMBO_PAIRS){ for(const p of pair){ const found=grouped.find(g=>g.spec===p && !usedCombo.has(g.id+'|'+g.spec)); if(!found) continue; const other=pair.find(x=>x!==p); const otherFound=grouped.find(g=>g.spec===other && g.id===found.id && !usedCombo.has(g.id+'|'+g.spec)); if(otherFound){ comboMap[found.id+'|'+found.spec]=otherFound.id+'|'+otherFound.spec; usedCombo.add(found.id+'|'+found.spec); usedCombo.add(otherFound.id+'|'+otherFound.spec); } } }
        grouped.forEach(g=>{ if(comboMap[g.id+'|'+g.spec]){ const o=grouped.find(x=>x.id+'|'+x.spec===comboMap[g.id+'|'+g.spec]); g.actual=g.qty+o.qty; } else { g.actual=g.qty*getMultiplier(g.spec); } });
        const idGroups={};
        grouped.forEach(g=>{ if(!idGroups[g.id]) idGroups[g.id]=[]; idGroups[g.id].push(g); });
        let flatRows=[];
        for(const id of Object.keys(idGroups).sort()){
          const items=idGroups[id];
          const totalAmount=items.reduce((s,x)=>s+x.amount,0);
          items.forEach((item,i)=>{
            if(i===0){ if(id===SPECIAL_ID){ flatRows.push({id:item.id,spec:item.spec,qty:item.qty,actual:item.actual,box:item.actual,amount:item.amount.toFixed(2),totalAmount:totalAmount.toFixed(2)}); } else { flatRows.push({id:item.id,spec:item.spec,qty:item.qty,actual:item.actual,box:items.reduce((s,x)=>s+x.actual,0),amount:item.amount.toFixed(2),totalAmount:totalAmount.toFixed(2)}); } }
            else { if(id===SPECIAL_ID){ flatRows.push({id:'',spec:item.spec,qty:item.qty,actual:item.actual,box:item.actual,amount:item.amount.toFixed(2),totalAmount:''}); } else { flatRows.push({id:'',spec:item.spec,qty:item.qty,actual:item.actual,box:'',amount:item.amount.toFixed(2),totalAmount:''}); } }
          });
        }
        const sheetName = f.name.replace(/\.[^.]+$/,'').slice(0,31);
        perFileResults.push({name:sheetName, flatRows:flatRows});
        grandAmount += fileRows.reduce((s,r)=>s+r.amount,0);
      }
      if(perFileResults.length===0){ showMsg(tab,'err','未找到 '+targetDate+' 的有效订单（排除 '+totalClosed+' 条）'); return; }
      let combinedFlat = [];
      perFileResults.forEach(pf=>{ combinedFlat = combinedFlat.concat(pf.flatRows); });
      showResult(tab, true);
      document.getElementById('stats-'+tab).innerHTML='<div class="stat"><div class="label">日期</div><div class="value">'+targetDate.slice(5)+'</div></div><div class="stat"><div class="label">文件</div><div class="value">'+perFileResults.length+'</div></div><div class="stat"><div class="label">成交额</div><div class="value">¥'+grandAmount.toFixed(0)+'</div></div>';
      const tbl=document.getElementById('table-'+tab);
      tbl.innerHTML='<thead><tr><th>商品ID</th><th>商品规格</th><th>商品数量</th><th>实际数量</th><th>总箱数</th><th>单规格成交额</th><th>商品总成交额</th></tr></thead>';
      const tb=document.createElement('tbody');
      combinedFlat.forEach(r=>{ tb.innerHTML+='<tr><td style="font-family:Consolas">'+r.id+'</td><td style="text-align:left">'+r.spec+'</td><td class="num">'+r.qty+'</td><td class="num">'+r.actual+'</td><td class="num">'+r.box+'</td><td class="num">'+r.amount+'</td><td class="num">'+r.totalAmount+'</td></tr>'; });
      tbl.appendChild(tb);
      window['_'+tab+'Sheets']=perFileResults;
      window['_'+tab+'Date']=targetDate;
      document.getElementById('btn-download-'+tab).style.display='inline-block';
      document.getElementById('btn-sheet-'+tab).style.display='inline-block';
      showMsg(tab,'ok','完成：'+perFileResults.length+' 个文件，¥'+grandAmount.toFixed(2));
    } catch(err){ showMsg(tab,'err','处理失败：'+err.message); }
  });
  document.getElementById('btn-sheet-'+tab).addEventListener('click', ()=>{
    const sheets=window['_'+tab+'Sheets']; if(!sheets||!sheets.length) return;
    const tabName = tab==='douyin'?'抖音':tab==='shipinhao'?'视频号':'快手';
    const sheetArr = sheets.map(pf=>{
      const rows = [['商品ID','商品规格','商品数量','实际数量','总箱数','单规格成交额','商品总成交额']];
      pf.flatRows.forEach(r=>{ rows.push([String(r.id||''), r.spec, r.qty, r.actual, r.box, parseFloat(r.amount), r.totalAmount?parseFloat(r.totalAmount):'']); });
      return {name: pf.name, rows: rows};
    });
    if(tab==='douyin'){ sheetArr.unshift(buildSummarySheet(sheets)); }
    openSpreadsheet(tabName+'订单汇总', sheetArr);
  });
  document.getElementById('btn-download-'+tab).addEventListener('click',()=>{
    const sheets=window['_'+tab+'Sheets']; if(!sheets||!sheets.length) return;
    const wb=XLSX.utils.book_new();
    if(tab==='douyin'){
      const sum = buildSummarySheet(sheets);
      const ws0 = XLSX.utils.aoa_to_sheet(sum.rows);
      ws0['!cols']=[{wch:10},{wch:20},{wch:18},{wch:12},{wch:16}];
      XLSX.utils.book_append_sheet(wb,ws0,'汇总');
    }
    sheets.forEach(pf=>{
      const ws=XLSX.utils.json_to_sheet(pf.flatRows);
      ws['!cols']=[{wch:22},{wch:40},{wch:12},{wch:12},{wch:12},{wch:16},{wch:16}];
      XLSX.utils.book_append_sheet(wb,ws,pf.name.slice(0,31));
    });
    XLSX.writeFile(wb,tab+'_订单汇总_'+(window['_'+tab+'Date']||'')+'.xlsx');
  });
});

function buildSummarySheet(perFileResults){
  const EXCLUDE_ID = '3817189452003016710';
  const QYQ_ID = '3823309765342266082';
  const FLAVORS = ['山葡萄','冰白葡萄','软枣','蔓越莓','白桦','山梨'];
  function isComboSpec(spec){ return /\+/.test(spec) || /组合/.test(spec); }
  const totals = {};
  perFileResults.forEach(pf=>{
    let currentId = '';
    let currentIsCombo = false;
    pf.flatRows.forEach(r=>{
      if(r.id){ currentId = r.id; currentIsCombo = isComboSpec(r.spec||''); }
      const id = currentId;
      if(id === EXCLUDE_ID) return;
      const spec = r.spec || '';
      if(id === QYQ_ID){
        if(/12瓶/.test(spec)){
          const k = '官方店|泉阳泉6罐';
          if(!totals[k]) totals[k]={box:0,amount:0};
          totals[k].box += parseFloat(r.box)||0;
          totals[k].amount += parseFloat(r.amount)||0;
        } else if(/24瓶/.test(spec)){
          const k = '官方店|泉阳泉24罐';
          if(!totals[k]) totals[k]={box:0,amount:0};
          totals[k].box += parseFloat(r.box)||0;
          totals[k].amount += parseFloat(r.amount)||0;
        }
        return;
      }
      if(currentIsCombo) return;
      if(!r.id) return;
      const isCanned = /罐/.test(spec);
      const store = isCanned ? '官方店' : '饮品店';
      for(const f of FLAVORS){
        if(spec.indexOf(f) !== -1){
          const productName = f + (isCanned ? '-罐装' : '-玻璃瓶');
          const k = store + '|' + productName;
          if(!totals[k]) totals[k]={box:0,amount:0};
          totals[k].box += parseFloat(r.box)||0;
          totals[k].amount += parseFloat(r.totalAmount)||0;
          break;
        }
      }
    });
  });
  const rows = [['店铺','商品ID','商品名','总箱数','合计成交金额']];
  const items = [
    ['饮品店','','山葡萄-玻璃瓶'],['饮品店','','冰白葡萄-玻璃瓶'],['饮品店','','软枣-玻璃瓶'],
    ['饮品店','','蔓越莓-玻璃瓶'],['饮品店','','白桦-玻璃瓶'],['饮品店','','山梨-玻璃瓶'],
    ['官方店','','山葡萄-罐装'],['官方店','','冰白葡萄-罐装'],['官方店','','软枣-罐装'],
    ['官方店','','蔓越莓-罐装'],['官方店','','白桦-罐装'],['官方店','','山梨-罐装'],
    ['官方店',QYQ_ID,'泉阳泉联名气泡水6罐'],['官方店','','泉阳泉联名气泡水12罐'],['官方店',QYQ_ID,'泉阳泉联名气泡水24罐']
  ];
  items.forEach(([store,pid,name])=>{
    const k = store+'|'+name;
    const t = totals[k] || {box:0, amount:0};
    rows.push([store, pid, name, t.box, parseFloat(t.amount.toFixed(2))]);
  });
  return {name:'汇总', rows:rows};
}
