  ['山葡萄原汁1箱+冰白葡萄原汁1箱320ml*12罐(到手12罐)','冰白葡萄原汁1箱320ml*6罐+山葡萄原汁1箱320ml*6瓶罐320ml*12罐(到手12罐)'],
  ['冰白葡萄原汁1箱320ml*6瓶+山葡萄原汁1箱320ml*6瓶(到手12瓶)','山葡萄原汁1箱320ml*6瓶+冰白葡萄原汁1箱320ml*6瓶(到手12瓶)']

// 规范化规格文本：去空格、统一括号，用于组合规格模糊匹配
function normalizeSpec(s){
  return String(s||'').replace(/\s+/g,'').replace(/（/g,'(').replace(/）/g,')').replace(/／/g,'/');
}
var COMBO_PAIRS_NORM = COMBO_PAIRS.map(function(p){ return p.map(normalizeSpec); });
function isComboSpec(spec){
  var n = normalizeSpec(spec);
  for(var i=0;i<COMBO_PAIRS_NORM.length;i++){
    if(COMBO_PAIRS_NORM[i].indexOf(n)!==-1) return true;
  }
  return false;
}
function findComboPairIdx(spec, pairedSet){
  var n = normalizeSpec(spec);
  for(var i=0;i<COMBO_PAIRS_NORM.length;i++){
    var a = COMBO_PAIRS_NORM[i][0], b = COMBO_PAIRS_NORM[i][1];
    if(n===a || n===b) return {pairIdx:i, self:n, other:n===a?b:a};
  }
  return null;
}
// 统一日期解析：Date对象用本地方法（不用toISOString避免UTC偏移），字符串兼容多种格式
function parseDateVal(dv){
  if(dv instanceof Date){
    var y=dv.getFullYear(), m=String(dv.getMonth()+1).padStart(2,'0'), d=String(dv.getDate()).padStart(2,'0');
    return y+'-'+m+'-'+d;
  }
  var s=String(dv).trim();
  var m=s.match(/(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
  if(m) return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  m=s.match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if(m){ var y=m[3]; if(y.length===2) y='20'+y; return y+'-'+m[1].padStart(2,'0')+'-'+m[2].padStart(2,'0'); }
  return '';
}

function openSpreadsheet(title, sheets) {

    localStorage.setItem('sheetTitle', title);

    window.open('sheet.html', '_blank');
  } catch(e) {
    alert('打开表格失败：' + e.message);

}

function setupUpload(tab, onFilesChanged){
  const zone = document.getElementById('upload-'+tab);
  const list = document.getElementById('file-list-'+tab);
  let files = [];
  zone.addEventListener('click',()=>{
    const inp = document.createElement('input');
    inp.type='file'; inp.multiple=true;
    inp.accept = tab==='summary' ? '.xlsx' : '.csv,.xlsx';
    inp.onchange = e=>{ addFiles(e.target.files); };
    inp.click();
  });
  zone.addEventListener('dragover',e=>{ e.preventDefault(); zone.classList.add('dragover'); });
  zone.addEventListener('dragleave',()=>zone.classList.remove('dragover'));
  zone.addEventListener('drop',e=>{ e.preventDefault(); zone.classList.remove('dragover'); addFiles(e.dataTransfer.files); });
  function addFiles(fl){
    for(const f of fl){
      files.push(f);
      const div = document.createElement('div');
      div.className='file-item';
      div.innerHTML = '<span>📄 '+f.name+' ('+(f.size/1024).toFixed(1)+'KB)</span><span class="rm">✕</span>';
      div.querySelector('.rm').onclick=()=>{ files=files.filter(x=>x!==f); div.remove(); if(onFilesChanged) onFilesChanged(files); };
      list.appendChild(div);
    }
    if(onFilesChanged) onFilesChanged(files);
  }
  return { getFiles:()=>files };
}

// 手动解析CSV文本，所有值保持字符串，避免SheetJS把长数字ID转成Number导致精度丢失
function parseCSVText(text){
  if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);
  var rows=[], row=[], field='', inQ=false;
  for(var i=0;i<text.length;i++){
    var ch=text[i];
    if(inQ){
      if(ch==='"'){ if(text[i+1]==='"'){field+='"';i++;} else inQ=false; }
      else field+=ch;
    } else {
      if(ch==='"') inQ=true;
      else if(ch===','){ row.push(field); field=''; }
      else if(ch==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(ch!=='\r') field+=ch;
    }
  }
  if(field!==''||row.length>0){ row.push(field); rows.push(row); }
  if(rows.length===0) return [];
  var headers=rows[0];
  return rows.slice(1).map(function(r){
    var obj={};
    for(var j=0;j<headers.length;j++) obj[headers[j]] = r[j]!==undefined?String(r[j]):'';
    return obj;
  });
}

// ===== 快手加密xlsx浏览器端解密 (Agile Encryption) =====
function findCfbEntry(ole, name){
  var dirs = ole.FileIndex || ole.FullPathDirectory || ole.FullPathDir || [];
  for(var i=0; i<dirs.length; i++){
    var e = dirs[i] || {};
    var entryName = String(e.name || e.path || e.fullName || '');
    if(entryName === name || entryName.endsWith('/'+name) || entryName.indexOf(name) >= 0) return e;
  }
  return null;
}
function cfbContent(entry){
  if(!entry) return null;
  var c = entry.content;
  if(!c) return null;
  if(c instanceof Uint8Array) return c;
  if(c instanceof ArrayBuffer) return new Uint8Array(c);
  if(Array.isArray(c)) return new Uint8Array(c);
  // Try converting
  try { return new Uint8Array(c); } catch(e){ return null; }
}

async function decryptAgileXlsx(buf, password){
  var cfb = XLSX.CFB;
  if(!cfb || !cfb.read) throw new Error('CFB容器解析不可用，请刷新页面后重试');
  var ole, parseErrors = [];
  var candidates = [buf, buf && buf.buffer ? buf.buffer.slice(buf.byteOffset||0,(buf.byteOffset||0)+buf.byteLength) : null].filter(Boolean);
  for(var ci=0; ci<candidates.length && !ole; ci++){
    var input=candidates[ci];
    var attempts = [{type:'buffer'},{type:'array'},{}];
    for(var oi=0; oi<attempts.length && !ole; oi++){
      try { ole = cfb.read(input, attempts[oi]); }
      catch(e) { parseErrors.push(e && e.message ? e.message : String(e)); }
    }
  }
  if(!ole) throw new Error('CFB容器读取失败：'+(parseErrors[0]||'文件格式不受支持'));
  var dirs = ole.FileIndex || ole.FullPathDirectory || ole.FullPathDir || [];
  if(!dirs.length) throw new Error('CFB目录为空，文件可能不是快手加密表格');
  var encEntry=findCfbEntry(ole,'EncryptionInfo');
  if(!encEntry) throw new Error('找不到EncryptionInfo加密信息流');
  var raw=cfbContent(encEntry);
  if(!raw || raw.length<9) throw new Error('EncryptionInfo内容为空或损坏');
  var xml=new DOMParser().parseFromString(new TextDecoder('utf-8').decode(raw.slice(8)),'text/xml');
  var key=xml.getElementsByTagName('p:encryptedKey')[0] || xml.getElementsByTagName('encryptedKey')[0];
  var kd=xml.getElementsByTagName('keyData')[0];
  if(!key || !kd) throw new Error('加密参数缺少encryptedKey或keyData');
  var attr=(el,n,d)=>el.getAttribute(n)||d;
  var alg=(attr(key,'hashAlgorithm',attr(kd,'hashAlgorithm','SHA512'))||'SHA512').toUpperCase().replace('-','');
  var blockSize=parseInt(attr(key,'blockSize',attr(kd,'blockSize','16')),10)||16;
  var keyBits=parseInt(attr(key,'keyBits',attr(kd,'keyBits','256')),10)||256;
  var spin=parseInt(attr(key,'spinCount','100000'),10)||100000;
  var salt=base64ToBytes(attr(key,'saltValue',''));
  var keyDataSalt=base64ToBytes(attr(kd,'saltValue',attr(key,'saltValue','')));
  var encryptedKeyValue=base64ToBytes(attr(key,'encryptedKeyValue',''));
  var verifierInput=base64ToBytes(attr(key,'encryptedVerifierHashInput',''));
  var verifierValue=base64ToBytes(attr(key,'encryptedVerifierHashValue',''));
  if(!salt.length || !encryptedKeyValue.length) throw new Error('加密参数不完整');
  var hashName={SHA1:'SHA-1',SHA256:'SHA-256',SHA384:'SHA-384',SHA512:'SHA-512'}[alg]||'SHA-512';
  var hashBytes=async d=>new Uint8Array(await crypto.subtle.digest(hashName,d));
  var u32=n=>{var x=new Uint8Array(4);new DataView(x.buffer).setUint32(0,n,true);return x;};
  var cat=(a,b)=>{var x=new Uint8Array(a.length+b.length);x.set(a);x.set(b,a.length);return x;};
  var fit=(x,n)=>{var y=new Uint8Array(n);y.set(x.slice(0,n));if(x.length<n)y.fill(0x36,x.length);return y;};
  var derive=async block=>{var h=await hashBytes(cat(salt,strToUtf16le(password)));for(var i=0;i<spin;i++)h=await hashBytes(cat(u32(i),h));return fit(await hashBytes(cat(h,new Uint8Array(block))),keyBits/8);};
  var aes=async (keyBytes,iv,data)=>{
    if(!window.CryptoJS) throw new Error('AES解密组件未加载，请检查网络后刷新页面');
    var wa=function(x){return CryptoJS.lib.WordArray.create(x);};
    var dec=CryptoJS.AES.decrypt({ciphertext:wa(data)},wa(keyBytes),{iv:wa(fit(iv,blockSize)),mode:CryptoJS.mode.CBC,padding:CryptoJS.pad.NoPadding});
    var out=new Uint8Array(dec.sigBytes); for(var z=0;z<dec.sigBytes;z++) out[z]=(dec.words[z>>>2] >>> (24-(z%4)*8)) & 255; return out;
  };
  var k1=await derive([0xFE,0xA7,0xD2,0x76,0x3B,0x4B,0x9E,0x79]);
  var k2=await derive([0xD7,0xAA,0x0F,0x6D,0x30,0x61,0x34,0x4E]);
  var k3=await derive([0x14,0x6E,0x0B,0xE7,0xAB,0xAC,0xD0,0xD6]);
  var vi=await aes(k1,salt,verifierInput), vv=await aes(k2,salt,verifierValue);
  var vh=await hashBytes(vi), ok=true; for(var j=0;j<vh.length;j++){if(vh[j]!==vv[j]){ok=false;break;}}
  if(!ok) throw new Error('密码校验失败，请确认密码正确');
  var contentKey=(await aes(k3,salt,encryptedKeyValue)).slice(0,keyBits/8);
  var pkgEntry=findCfbEntry(ole,'EncryptedPackage'); if(!pkgEntry) throw new Error('找不到EncryptedPackage数据流');
  var pkg=cfbContent(pkgEntry); if(!pkg || pkg.length<8) throw new Error('EncryptedPackage数据为空或损坏');
  var size=Number(new DataView(pkg.buffer,pkg.byteOffset,pkg.byteLength).getBigUint64(0,true));
  var body=pkg.slice(8), out=[];
  var dataBlock=parseInt(attr(kd,'blockSize','16'),10)||16;
  for(var off=0,seg=0;off<body.length;off+=4096,seg++){
    var part=body.slice(off,Math.min(off+4096,body.length));
    var iv=fit(await (async()=>{var h=await hashBytes(cat(keyDataSalt,u32(seg)));return h;})(),dataBlock);
    out.push(await aes(contentKey,iv,part));
  }
  var total=out.reduce((n,x)=>n+x.length,0), dec=new Uint8Array(total), pos=0; out.forEach(x=>{dec.set(x,pos);pos+=x.length;});
  return dec.slice(0,size);
}

function base64ToBytes(b64){
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr;
}
function strToUtf16le(str){
  const arr = new Uint8Array(str.length * 2);
  for(let i = 0; i < str.length; i++){
    arr[i*2] = str.charCodeAt(i) & 0xFF;
    arr[i*2+1] = (str.charCodeAt(i) >> 8) & 0xFF;
  }
  return arr;
}
function concatBytes(a, b){
  const c = new Uint8Array(a.length + b.length);
  c.set(a, 0);
  c.set(b, a.length);
  return c;
}

function readFile(file, platform){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    if(file.name.toLowerCase().endsWith('.csv')){
      reader.onload = e=>{
        try{
          var rows = parseCSVText(e.target.result);
          resolve({SheetNames:['Sheet1'], Sheets:{Sheet1: rows}});
        }catch(err){reject(err);}
      };
      reader.readAsText(file,'utf-8');
    } else {
      reader.onload = async e=>{
        try{
          var buf = new Uint8Array(e.target.result);
          // Check if OLE2 (encrypted file header: D0CF11E0A1B11AE1)
          var isOle = buf.length > 8 && buf[0]===0xD0 && buf[1]===0xCF && buf[2]===0x11 && buf[3]===0xE0;
          if(isOle && platform==='kuaishou'){
            var pw = document.getElementById('ks-password').value.trim();
            if(!pw) throw new Error('请先输入快手文件密码');
            var decrypted = await decryptAgileXlsx(buf, pw);
            resolve(XLSX.read(decrypted, {type:'array',cellDates:true}));
          } else {
            resolve(XLSX.read(buf,{type:'array',cellDates:true}));
          }
        }catch(err){reject(err);}
      };
      reader.onerror = reject;
      reader.readAsArrayBuffer(file);
    }
  });
}
function sheetToJson(ws){ return Array.isArray(ws) ? ws : XLSX.utils.sheet_to_json(ws,{defval:''}); }

document.getElementById('btn-process-summary').addEventListener('click', async ()=>{
  const files = uploads.summary.getFiles();
  if(files.length===0){ showMsg('summary','err','请先上传文件'); return; }
  showMsg('summary','warn','正在处理...');
  try {
    let allRows=[], fileCount=files.length;
    for(const f of files){
      const wb = await readFile(f);
      for(const sn of wb.SheetNames){
        const rows = sheetToJson(wb.Sheets[sn]);
        for(const r of rows){
          const dateCol = Object.keys(r).find(k=>/日期|时间/i.test(k));
          if(!dateCol) continue;
          const dv = String(r[dateCol]).trim();
          if(dv==='全部'||dv==='') continue;
          const idCol = Object.keys(r).find(k=>/商品ID|商品id/i.test(k));
          const nameCol = Object.keys(r).find(k=>/商品名称|商品名/i.test(k));
          const costCol = Object.keys(r).find(k=>/整体消耗|消耗/i.test(k));
          if(!idCol||!costCol) continue;
          allRows.push({id:String(r[idCol]).trim(), name:nameCol?String(r[nameCol]).trim():'', date:dv, cost:parseFloat(String(r[costCol]).replace(/,/g,''))||0, source:f.name});
        }
      }
    }
    if(allRows.length===0){ showMsg('summary','err','未解析到有效数据'); return; }
    const seen=new Set(), dupes=[];
    for(const r of allRows){ const k=r.source+'|'+r.id; if(seen.has(k)) dupes.push(r); seen.add(k); }
    if(dupes.length>0){ showMsg('summary','err','发现 '+dupes.length+' 条重复数据，已停止处理。'); return; }
    const groups={};
    for(const r of allRows){ if(!groups[r.id]) groups[r.id]={id:r.id,name:r.name,total:0,dates:[]}; groups[r.id].total+=r.cost; groups[r.id].dates.push(r); }
    let result = Object.values(groups).map(g=>({...g, pkg:CANNED_IDS.includes(g.id)?'罐装':'瓶装'}));
    result.sort((a,b)=>{ if(a.pkg!==b.pkg) return a.pkg==='罐装'?-1:1; if(a.id!==b.id) return a.id<b.id?-1:1; return 0; });
    let flatRows=[];
    let cannedWritten=false, bottledWritten=false;
    for(const g of result){
      const dates = g.dates.sort((a,b)=>a.date.localeCompare(b.date));
      dates.forEach((d,i)=>{
        let pkgVal='';
        if(i===0){
          if(g.pkg==='罐装' && !cannedWritten){ pkgVal='罐装'; cannedWritten=true; }
          else if(g.pkg==='瓶装' && !bottledWritten){ pkgVal='瓶装'; bottledWritten=true; }
        }
        flatRows.push({pkg:pkgVal, id:i===0?g.id:'', name:i===0?g.name:'', date:d.date, cost:d.cost.toFixed(2), total:i===0?g.total.toFixed(2):''});
      });
    }
    showResult('summary', true);
    document.getElementById('stats-summary').innerHTML='<div class="stat"><div class="label">文件</div><div class="value">'+fileCount+'</div></div><div class="stat"><div class="label">记录</div><div class="value">'+allRows.length+'</div></div><div class="stat"><div class="label">总消耗</div><div class="value">¥'+allRows.reduce((s,r)=>s+r.cost,0).toFixed(2)+'</div></div>';
    const tbl=document.getElementById('table-summary');
    tbl.innerHTML='<thead><tr><th>包装</th><th>商品ID</th><th>商品名称</th><th>日期</th><th>整体消耗</th><th>总消耗</th></tr></thead>';
    const tb=document.createElement('tbody');
    flatRows.forEach(r=>{ tb.innerHTML+='<tr><td>'+r.pkg+'</td><td style="font-family:Consolas">'+r.id+'</td><td>'+r.name+'</td><td>'+r.date+'</td><td class="num">'+r.cost+'</td><td class="num">'+r.total+'</td></tr>'; });
    tbl.appendChild(tb);
    window._summaryData=flatRows;
    document.getElementById('btn-download-summary').style.display='inline-block';
    document.getElementById('btn-sheet-summary').style.display='inline-block';
    showMsg('summary','ok','完成：'+allRows.length+' 条记录，'+Object.keys(groups).length+' 个商品');
  } catch(err){ showMsg('summary','err','处理失败：'+err.message); }
});

function getMultiplier(spec){
  if(/30[瓶罐]/.test(spec)) return 5;
  if(/24[瓶罐]/.test(spec)) return 1;
  if(/12[瓶罐]/.test(spec)) return 2;
  return 1;
}
// 视频号：从规格文本中提取瓶/罐数
function extractBottleCount(spec){
  var m=String(spec||'').match(/到手\s*(\d+)\s*[瓶罐]/);
  if(m) return parseInt(m[1]);
  m=String(spec||'').match(/(\d+)\s*[瓶罐]/);
  return m?parseInt(m[1]):0;
}
// 视频号的规格信息在"商品属性"列，需要从中提取规格文本
function extractSpec(attr){
  if(!attr) return '';
  var s=String(attr).trim();
  if(s.indexOf('规格:')===0||s.indexOf('规格：')===0){
    s=s.replace(/^规格[:：]/,'');
    var semi=s.indexOf(';'); if(semi===-1) semi=s.indexOf('；');
    if(semi!==-1) s=s.substring(0,semi);
  } else if(s.indexOf('净含量:')===0||s.indexOf('净含量：')===0){
    s=s.replace(/^净含量[:：]/,'');
  }
  return s.trim();
}
async function detectDates(files, platform){
  const dateSet = new Set();
  for(const f of files){
    const wb = await readFile(f, platform);
    for(const sn of wb.SheetNames){
      const rows = sheetToJson(wb.Sheets[sn]);
      for(const r of rows){
        const dateCol = Object.keys(r).find(k=>/支付完成时间|订单支付时间|支付时间/i.test(k));
        if(!dateCol) continue;
        const dv = r[dateCol];
        const rowDate = parseDateVal(dv);
        if(rowDate) dateSet.add(rowDate);
      }
    }
  }
  return [...dateSet].sort();
}

    if(!selectedDate){ showMsg(tab,'err','未识别到日期'); return; }
    const targetDate = selectedDate;
    showMsg(tab,'warn','正在处理 '+targetDate+'...');
    try {
      // 按文件独立处理，每个文件一个子表
      let perFileResults = [];
      let totalClosed = 0, grandRows = 0, grandAmount = 0;

      for(const f of files){
        // Step 1: 读文件，按日期筛选，排除已关闭，按商品ID+规格分组求和
        const wb=await readFile(f, tab);
        let fileRows=[];
        for(const sn of wb.SheetNames){
          const rows=sheetToJson(wb.Sheets[sn]);
          for(const r of rows){
            const dateCol=Object.keys(r).find(k=>/支付完成时间|订单支付时间|支付时间/i.test(k));
            const idCol=Object.keys(r).find(k=>/商品ID|商品id|商品编码\(平台\)/i.test(k));
            var specCol=Object.keys(r).find(k=>/商品规格|规格名称/i.test(k));
            if(!specCol) specCol=Object.keys(r).find(k=>k==='商品属性');
            const nameCol=Object.keys(r).find(k=>/商品名称|商品名|商品标题/i.test(k));
            const qtyCol=Object.keys(r).find(k=>/商品数量|成交数量|数量/i.test(k));
            var priceCol=Object.keys(r).find(k=>k==='商品单价'||k==='商品实际价格(单件)');
            if(!priceCol) priceCol=Object.keys(r).find(k=>/商品价格\(单件\)|单价|价格/i.test(k));
            const statusCol=Object.keys(r).find(k=>/订单状态|交易状态|状态/i.test(k));
            if(!idCol||!qtyCol) continue;
            if(statusCol){ const st=String(r[statusCol]).trim(); if(st==='已关闭'||st==='交易关闭'||st==='已取消'){ totalClosed++; continue; } }
            if(dateCol){
              const rowDate=parseDateVal(r[dateCol]);
              if(rowDate!==targetDate) continue;
            }
            const qty=parseFloat(String(r[qtyCol]).replace(/,/g,''))||0;
            const price=priceCol?(parseFloat(String(r[priceCol]).replace(/[¥￥,，\s]/g,''))||0):0;
            var rawSpec=specCol?String(r[specCol]).trim():'';
            if(tab!=='shipinhao' && specCol==='商品属性') rawSpec=extractSpec(rawSpec);
            const prodName=nameCol?String(r[nameCol]).trim():'';
            fileRows.push({id:String(r[idCol]).trim(), spec:rawSpec, name:prodName, qty:qty, amount:price*qty});
          }
        }
        if(fileRows.length===0) continue;

        // Step 1续: 按ID+规格分组，按ID、规格排序
        const groups={};
        for(const r of fileRows){ const k=r.id+'\u0000'+r.spec; if(!groups[k]) groups[k]={id:r.id,spec:r.spec,name:r.name||'',qty:0,amount:0}; groups[k].qty+=r.qty; groups[k].amount+=r.amount; }
        let grouped=Object.values(groups).sort((a,b)=>{ if(a.id!==b.id) return a.id<b.id?-1:1; return a.spec<b.spec?-1:1; });

        // Step 3: 组合规格配对（抖音/快手用，视频号跳过）
        var comboPaired=new Set(), comboIdxMap={};
        if(tab!=='shipinhao'){
          for(var pi=0;pi<COMBO_PAIRS_NORM.length;pi++){
            var pairNorm = COMBO_PAIRS_NORM[pi];
            var matched = {};
            for(var gi=0; gi<grouped.length; gi++){
              if(comboPaired.has(gi)) continue;
              var info = findComboPairIdx(grouped[gi].spec, comboPaired);
              if(!info || info.pairIdx!==pi) continue;
              var otherNorm = info.other;
              if(matched[otherNorm] !== undefined){
                var oIdx = matched[otherNorm];
                comboIdxMap[gi] = oIdx;
                comboIdxMap[oIdx] = gi;
                comboPaired.add(gi);
                comboPaired.add(oIdx);
                delete matched[otherNorm];
              } else {
                matched[info.self] = gi;
              }
            }
          }
        }
        // Step 3续: 计算实际数量
        grouped.forEach((g,idx)=>{
          if(tab==='shipinhao'){
            g.bottleCount=extractBottleCount(g.spec);
            g.multiplier=getMultiplier(g.spec);
            g.boxCount=g.qty*g.multiplier;
            g.actual=g.qty;
          } else if(comboIdxMap[idx]!==undefined){
            g.actual=g.qty+grouped[comboIdxMap[idx]].qty;
          } else {
            g.actual=g.qty*getMultiplier(g.spec);
          }
        });

        // Step 4/5: 按商品ID分组，生成扁平行
        const idGroups={};
        grouped.forEach(g=>{ if(!idGroups[g.id]) idGroups[g.id]=[]; idGroups[g.id].push(g); });
        let flatRows=[];
        for(const id of Object.keys(idGroups).sort()){
          const items=idGroups[id];
          if(tab==='shipinhao'){
            const totalBox=items.reduce((s,x)=>s+x.boxCount,0);
            const totalAmount=items.reduce((s,x)=>s+x.amount,0);
            items.forEach((item,i)=>{
              const isSpecial=SPECIAL_IDS.indexOf(id)!==-1;
              flatRows.push({
                id:(i===0||isSpecial)?item.id:'',
                spec:item.spec, name:item.name||'',
                qty:item.qty,
                bottleCount:item.bottleCount,
                multiplier:item.multiplier,
                boxCount:item.boxCount,
                box:(i===0||isSpecial)?(isSpecial?item.boxCount:totalBox):'',
                amount:item.amount.toFixed(2),
                totalAmount:(i===0||isSpecial)?(isSpecial?totalAmount.toFixed(2):totalAmount.toFixed(2)):''
              });
            });
          } else {
            const totalAmount=items.reduce((s,x)=>s+x.amount,0);
            const totalBox=items.reduce((s,x)=>s+x.actual,0);
            items.forEach((item,i)=>{
              if(i===0){
                flatRows.push({
                  id:item.id, spec:item.spec, qty:item.qty, actual:item.actual,
                  box: SPECIAL_IDS.indexOf(id)!==-1 ? item.actual : totalBox,
                  amount:item.amount.toFixed(2),
                  totalAmount:totalAmount.toFixed(2)
                });
              } else {
                flatRows.push({
                  id:'', spec:item.spec, qty:item.qty, actual:item.actual,
                  box: SPECIAL_IDS.indexOf(id)!==-1 ? item.actual : '',
                  amount:item.amount.toFixed(2),
                  totalAmount:''
                });
              }
            });
          }
        }

        const sheetName = f.name.replace(/\.[^.]+$/,'').slice(0,31);
        perFileResults.push({name:sheetName, flatRows:flatRows, rows:fileRows.length, amount:fileRows.reduce((s,r)=>s+r.amount,0)});
        grandRows += fileRows.length;
        grandAmount += fileRows.reduce((s,r)=>s+r.amount,0);
      }

      if(perFileResults.length===0){ showMsg(tab,'err','未找到 '+targetDate+' 的有效订单（排除 '+totalClosed+' 条）'); return; }

      // 主页面预览：合并所有文件结果
      let combinedFlat = [];
      perFileResults.forEach(pf=>{ combinedFlat = combinedFlat.concat(pf.flatRows); });

      showResult(tab, true);
      document.getElementById('stats-'+tab).innerHTML='<div class="stat"><div class="label">日期</div><div class="value">'+targetDate.slice(5)+'</div></div><div class="stat"><div class="label">文件</div><div class="value">'+perFileResults.length+'</div></div><div class="stat"><div class="label">成交额</div><div class="value">¥'+grandAmount.toFixed(0)+'</div></div>';
      const tbl=document.getElementById('table-'+tab);
      if(tab==='shipinhao'){
        tbl.innerHTML='<thead><tr><th>商品ID</th><th>规格</th><th>实际数量</th><th>瓶/罐数</th><th>换算系数</th><th>箱数</th><th>总箱数</th></tr></thead>';
        const tb=document.createElement('tbody');
        combinedFlat.forEach(r=>{ tb.innerHTML+='<tr><td style="font-family:Consolas">'+(r.id||'')+'</td><td style="text-align:left">'+r.spec+'</td><td class="num">'+r.qty+'</td><td class="num">'+(r.bottleCount||'')+'</td><td class="num">'+(r.multiplier||'')+'</td><td class="num">'+(r.boxCount||'')+'</td><td class="num">'+(r.box||'')+'</td></tr>'; });
        tbl.appendChild(tb);
      } else {
        tbl.innerHTML='<thead><tr><th>商品ID</th><th>商品规格</th><th>商品数量合计</th><th>实际数量</th><th>总箱数</th><th>单规格成交额</th><th>商品总成交额</th></tr></thead>';
        const tb=document.createElement('tbody');
        combinedFlat.forEach(r=>{ tb.innerHTML+='<tr><td style="font-family:Consolas">'+r.id+'</td><td style="text-align:left">'+r.spec+'</td><td class="num">'+r.qty+'</td><td class="num">'+r.actual+'</td><td class="num">'+r.box+'</td><td class="num">'+r.amount+'</td><td class="num">'+r.totalAmount+'</td></tr>'; });
        tbl.appendChild(tb);
      }
      window['_'+tab+'Sheets']=perFileResults;
      window['_'+tab+'Date']=targetDate;
      document.getElementById('btn-download-'+tab).style.display='inline-block';
      document.getElementById('btn-sheet-'+tab).style.display='inline-block';
      showMsg(tab,'ok','完成：'+perFileResults.length+' 个文件，¥'+grandAmount.toFixed(2));
    } catch(err){ showMsg(tab,'err','处理失败：'+err.message); }
  });
  document.getElementById('btn-sheet-'+tab).addEventListener('click', ()=>{
    const sheets=window['_'+tab+'Sheets']; if(!sheets||!sheets.length) return;
    const tabName = tab==='douyin'?'抖音':tab==='shipinhao'?'视频号':'快手';
    const sheetArr = sheets.map(pf=>{
      if(tab==='shipinhao'){
        const rows = [['商品ID','规格','实际数量','瓶/罐数','换算系数','箱数','总箱数']];
        pf.flatRows.forEach(r=>{ rows.push([String(r.id||''), r.spec, r.qty, r.bottleCount||'', r.multiplier||'', r.boxCount||'', r.box||'']); });
        return {name: pf.name, rows: rows};
      }
      const rows = [['商品ID','商品规格','商品数量合计','实际数量','总箱数','单规格成交额','商品总成交额']];
      pf.flatRows.forEach(r=>{ rows.push([String(r.id||''), r.spec, r.qty, r.actual, r.box, parseFloat(r.amount), r.totalAmount?parseFloat(r.totalAmount):'']); });
      return {name: pf.name, rows: rows};
    });
    // 抖音用固定15行汇总页，视频号用动态两段式汇总页
    if(tab==='douyin'){
      sheetArr.unshift(buildSummarySheet(sheets));
    } else if(tab==='shipinhao'){
      sheetArr.unshift(buildSPHSummarySheet(sheets));
    }
    openSpreadsheet(tabName+'订单汇总', sheetArr);
  });
  document.getElementById('btn-download-'+tab).addEventListener('click',()=>{
    const sheets=window['_'+tab+'Sheets']; if(!sheets||!sheets.length) return;
    const wb=XLSX.utils.book_new();
    if(tab==='douyin'||tab==='shipinhao'){
      const sum = tab==='shipinhao'?buildSPHSummarySheet(sheets):buildSummarySheet(sheets);
      const ws0 = XLSX.utils.aoa_to_sheet(sum.rows);
      ws0['!cols']=[{wch:10},{wch:20},{wch:18},{wch:12},{wch:16}];
      XLSX.utils.book_append_sheet(wb,ws0,'汇总');
    }
    sheets.forEach(pf=>{
      let ws;
      if(tab==='shipinhao'){
        ws = XLSX.utils.aoa_to_sheet([['商品ID','规格','实际数量','瓶/罐数','换算系数','箱数','总箱数']].concat(
          pf.flatRows.map(r=>[String(r.id||''),r.spec,r.qty,r.bottleCount||'',r.multiplier||'',r.boxCount||'',r.box||''])
        ));
        ws['!cols']=[{wch:20},{wch:50},{wch:12},{wch:12},{wch:12},{wch:12},{wch:12}];
      } else {
        ws = XLSX.utils.json_to_sheet(pf.flatRows.map(r=>({商品ID:r.id,商品规格:r.spec,商品数量合计:r.qty,实际数量:r.actual,总箱数:r.box,单规格成交额:parseFloat(r.amount),商品总成交额:r.totalAmount?parseFloat(r.totalAmount):''})));
        ws['!cols']=[{wch:22},{wch:40},{wch:12},{wch:12},{wch:12},{wch:16},{wch:16}];
      }
      XLSX.utils.book_append_sheet(wb,ws,pf.name.slice(0,31));
    });
    XLSX.writeFile(wb,tab+'_订单汇总_'+(window['_'+tab+'Date']||'')+'.xlsx');
  });
});

// 抖音汇总页（Step 8）：15个固定商品
function buildSummarySheet(perFileResults){
  const EXCLUDE_ID = '3817189452003016710';
  const QYQ_ID = '3823309765342266082';
  const FLAVORS = ['山葡萄','冰白葡萄','软枣','蔓越莓','白桦','山梨'];
  const totals = {};
  perFileResults.forEach(pf=>{
    let currentId='';
    let groupRows=[];
    function flush(){
      if(!currentId || !groupRows.length) return;
      if(currentId===EXCLUDE_ID) return;
      if(SPECIAL_IDS.indexOf(currentId)!==-1){
        groupRows.forEach(r=>{
          const spec=r.spec||'';
          const box=parseFloat(r.box)||0;
          const amt=parseFloat(r.amount)||0;
          if(spec.indexOf('12瓶')!==-1){
            const k='官方店|泉阳泉联名气泡水6罐';
            if(!totals[k]) totals[k]={box:0,amount:0};
            totals[k].box+=box; totals[k].amount+=amt;
          } else if(spec.indexOf('24瓶')!==-1){
            const k='官方店|泉阳泉联名气泡水24罐';
            if(!totals[k]) totals[k]={box:0,amount:0};
            totals[k].box+=box; totals[k].amount+=amt;
          }
        });
        return;
      }
      let flavorRow=null;
      for(let i=0;i<groupRows.length;i++){ if(!isComboSpec(groupRows[i].spec)){ flavorRow=groupRows[i]; break; } }
      if(!flavorRow) flavorRow=groupRows[0];
      const spec=flavorRow.spec||'';
      let flavor=null;
      for(let j=0;j<FLAVORS.length;j++){ if(spec.indexOf(FLAVORS[j])===0){ flavor=FLAVORS[j]; break; } }
      if(!flavor){ for(let j=0;j<FLAVORS.length;j++){ if(spec.indexOf(FLAVORS[j])!==-1){ flavor=FLAVORS[j]; break; } } }
      if(!flavor) return;
      const isCanned=spec.indexOf('罐')!==-1;
      const store=isCanned?'官方店':'饮品店';
      const productName=flavor+(isCanned?'-罐装':'-玻璃瓶');
      const k=store+'|'+productName;
      if(!totals[k]) totals[k]={box:0,amount:0,id:currentId};
      if(!totals[k].id) totals[k].id=currentId;
      totals[k].box+=parseFloat(groupRows[0].box)||0;
      totals[k].amount+=parseFloat(groupRows[0].totalAmount)||0;
    }
    pf.flatRows.forEach(r=>{
      if(r.id){ flush(); currentId=r.id; groupRows=[r]; }
      else { groupRows.push(r); }
    });
    flush();
  });
  const rows=[['店铺','商品ID','商品名','总箱数','合计成交金额']];
  const items=[
    ['饮品店','','山葡萄-玻璃瓶'],
    ['饮品店','','冰白葡萄-玻璃瓶'],
    ['饮品店','','软枣-玻璃瓶'],
    ['饮品店','','蔓越莓-玻璃瓶'],
    ['饮品店','','白桦-玻璃瓶'],
    ['饮品店','','山梨-玻璃瓶'],
    ['官方店','','山葡萄-罐装'],
    ['官方店','','冰白葡萄-罐装'],
    ['官方店','','软枣-罐装'],
    ['官方店','','蔓越莓-罐装'],
    ['官方店','','白桦-罐装'],
    ['官方店','','山梨-罐装'],
    ['官方店',QYQ_ID,'泉阳泉联名气泡水6罐'],
    ['官方店','','泉阳泉联名气泡水12罐'],
    ['官方店',QYQ_ID,'泉阳泉联名气泡水24罐']
  ];
  items.forEach(([store,pid,name])=>{
    const k=store+'|'+name;
    const t=totals[k]||{box:0,amount:0,id:''};
    rows.push([store,t.id||pid,name,t.box,Math.round(t.amount*100)/100]);
  });
  return {name:'汇总',rows:rows};
}

// 视频号汇总页：两段式（店铺汇总 + 商品明细）
function buildSPHSummarySheet(perFileResults){
  var rows=[];
  // 第一段：店铺级汇总
  rows.push(['店铺','商品种类数','规格组合数','总实际数量','总箱数']);
  var grandKinds=0, grandSpecs=0, grandQty=0, grandBox=0;
  var productRows=[];
  perFileResults.forEach(function(pf){
    var store=pf.name;
    var ids=new Set(), specs=0, totalQty=0, totalBox=0;
    pf.flatRows.forEach(function(r){
      if(r.id) ids.add(r.id);
      specs++;
      totalQty+=r.qty||0;
      var boxVal=r.box||0;
      if(boxVal) totalBox+=parseFloat(boxVal);
      // 商品明细行：有商品ID的行
      if(r.id){
        productRows.push({store:store, id:r.id, name:r.name||'', box:parseFloat(boxVal)||0, amount:parseFloat(r.totalAmount)||0});
      }
    });
    rows.push([store, ids.size, specs, totalQty, totalBox]);
    grandKinds+=ids.size; grandSpecs+=specs; grandQty+=totalQty; grandBox+=totalBox;
  });
  rows.push(['合计', grandKinds, grandSpecs, grandQty, grandBox]);
  rows.push(['','','','','']);
  // 第二段：商品明细
  rows.push(['店铺','商品ID','商品名','总箱数','合计成交金额']);
  productRows.forEach(function(p){
    rows.push([p.store, p.id, p.name, p.box, Math.round(p.amount*100)/100]);
  });
  return {name:'汇总',rows:rows};
}
