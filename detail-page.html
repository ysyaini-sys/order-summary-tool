<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>商品详情页项目工作台</title>
  <style>
    body { max-width: 960px; margin: 0 auto; padding: 32px 20px; font: 16px/1.6 system-ui, sans-serif; color: #202124; }
    form { display: grid; gap: 12px; max-width: 620px; } label { display: grid; gap: 4px; } input, select, button { padding: 9px; font: inherit; } .actions { display: flex; gap: 8px; } pre { background: #f5f6f7; padding: 16px; overflow: auto; } #status { font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>商品详情页项目工作台</h1>
    <p><a href="content-center.html">返回电商内容中心</a> · 商品详情页是六阶段内容流程中的一个生产 Skill。</p>
    <p>从上一次商品详情页项目继续，先锁定商品身份，再进入蓝图、视觉和 QA。checkpoint 使用 <code>continuingFrom</code> 保存续接来源。</p>
    <form>
      <label>商品名称 <input id="product-name" autocomplete="off"></label>
      <label>项目 ID <input id="project-id" autocomplete="off" placeholder="如 rice-2026"></label>
      <label>Continuing from 来源 <input id="continuing-source" autocomplete="off" placeholder="上一次任务、对话或 checkpoint"></label>
      <label>商品主体图路径 <input id="hero-asset" autocomplete="off" placeholder="assets/hero.png"></label>
      <label>规格/包装身份 <input id="specification" autocomplete="off" placeholder="如 5kg"></label>
      <label>目标平台 <select id="platform"><option value="">请选择</option><option value="douyin">抖音/千川</option><option value="tmall">天猫</option><option value="pdd">拼多多</option></select></label>
      <label>当前步骤 <input id="current-step" value="product-brief"></label>
      <label>下一步 <input id="next-step" value="补齐商品设计资料清单"></label>
      <label>核心卖点 <input id="core-claim" autocomplete="off" placeholder="如 5kg 家庭装"></label>
      <label>卖点证据状态 <select id="evidence-state"><option value="needs-proof">待补证据</option><option value="provided-unverified">商家提供、未独立核验</option><option value="verified">已核验</option></select></label>
      <label>页面蓝图 <textarea id="page-blueprint" rows="7" placeholder="首屏\n核心卖点\n使用场景\n证据\n规格\n购买行动"></textarea></label>
      <fieldset><legend>已完成步骤</legend>
        <label><input class="completed-step" id="completed-step-product-brief" type="checkbox" value="product-brief"> 商品简报</label>
        <label><input class="completed-step" id="completed-step-storyboard" type="checkbox" value="storyboard"> 页面故事板</label>
        <label><input class="completed-step" id="completed-step-art-direction" type="checkbox" value="art-direction"> 视觉方向锁定</label>
        <label><input class="completed-step" id="completed-step-visual-master" type="checkbox" value="visual-master"> 视觉母版</label>
        <label><input class="completed-step" id="completed-step-qa" type="checkbox" value="qa"> Designer QA</label>
      </fieldset>
      <div class="actions"><button type="button" id="save-checkpoint">保存 checkpoint</button><button type="button" id="resume-checkpoint">恢复上次 checkpoint</button><button type="button" id="export-checkpoint">导出 checkpoint</button><label><input type="file" id="import-checkpoint" accept="application/json"> 导入 checkpoint</label></div>
      <button type="button" id="ask-ai">请 AI 继续当前详情页步骤</button>
    </form>
    <p>状态：<span id="status">BLOCKED_IDENTITY</span></p>
    <pre id="checkpoint">{}</pre>
    <section aria-labelledby="ai-result-heading"><h2 id="ai-result-heading">AI 工作结果</h2><p id="ai-status">尚未请求 AI</p><pre id="ai-result"></pre></section>
  </main>
  <script src="detail-page.js"></script>
</body>
</html>
